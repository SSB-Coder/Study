<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linear Regression & Gradient Descent — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .header {
      text-align: center;
      max-width: 800px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 8px;
    }
    .desc {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .nav-bar {
      margin-top: 8px;
      margin-bottom: 16px;
    }
    .nav-bar a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid #1e293b;
      padding: 4px 12px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .nav-bar a:hover {
      background: #1e293b;
    }
    .sim-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 1000px;
      width: 100%;
    }
    canvas {
      background: #030712;
      border: 1px solid #374151;
      border-radius: 8px;
      cursor: crosshair;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-top: 16px;
      width: 100%;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button.secondary {
      background: #374151;
    }
    button.secondary:hover { background: #4b5563; }
    .param-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    input[type="range"] {
      accent-color: #3b82f6;
    }
    .metrics-panel {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      font-size: 0.9rem;
      color: #a7f3d0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #0f172a;
      padding: 10px 20px;
      border-radius: 6px;
      border: 1px solid #1e293b;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Linear Regression & Gradient Descent</h1>
    <p class="desc">Module B: Interactive 2D gradient descent fitting linear weights to points in real time.</p>
    <div class="nav-bar"><a href="index.html">← Back to All Visualizers</a></div>
  </div>

  <div class="sim-card">
    <canvas id="simCanvas" width="650" height="420"></canvas>
    
    <div class="controls">
      
<button id="btnStep">Step Gradient</button>
<button id="btnRun">Run / Pause</button>
<button id="btnReset" class="secondary">Reset</button>
<div class="param-group">
  <label>Learning Rate:</label>
  <input type="range" id="sliderLr" min="0.001" max="0.05" step="0.001" value="0.01">
  <span id="lblLr">0.01</span>
</div>

    </div>

    <div class="metrics-panel" id="metricsPanel">
      <span>Status: Ready</span>
    </div>
  </div>

  <script>
    
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let points = [];
let w = 0.0, b = 0.0;
let lr = 0.01;
let isRunning = false;
let stepCount = 0;

function reset() {
  points = [];
  for (let i = 0; i < 25; i++) {
    let x = 50 + Math.random() * (W - 100);
    let y = 0.5 * x + 50 + (Math.random() - 0.5) * 80;
    points.push({ x: (x - W/2) / 100, y: (H - y - H/2) / 100 });
  }
  w = 0.0;
  b = 0.0;
  stepCount = 0;
  draw();
}

function step() {
  if (points.length === 0) return;
  let dw = 0, db = 0, loss = 0;
  for (let p of points) {
    let yHat = w * p.x + b;
    let err = yHat - p.y;
    loss += err * err;
    dw += 2 * err * p.x;
    db += 2 * err;
  }
  dw /= points.length;
  db /= points.length;
  loss /= points.length;

  w -= lr * dw;
  b -= lr * db;
  stepCount++;

  document.getElementById('metricsPanel').innerHTML = 
    `<span>Step: ${stepCount}</span><span>Weight w: ${w.toFixed(3)}</span><span>Bias b: ${b.toFixed(3)}</span><span>MSE: ${loss.toFixed(4)}</span>`;
  draw();
}

function toScreen(x, y) {
  return { sx: x * 100 + W/2, sy: H/2 - y * 100 };
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  // Grid
  ctx.strokeStyle = '#1f2937';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, H/2); ctx.lineTo(W, H/2);
  ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H);
  ctx.stroke();

  // Points
  ctx.fillStyle = '#60a5fa';
  for (let p of points) {
    let s = toScreen(p.x, p.y);
    ctx.beginPath();
    ctx.arc(s.sx, s.sy, 5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Regression Line
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 2.5;
  let pLeft = toScreen(-3, w * (-3) + b);
  let pRight = toScreen(3, w * 3 + b);
  ctx.beginPath();
  ctx.moveTo(pLeft.sx, pLeft.sy);
  ctx.lineTo(pRight.sx, pRight.sy);
  ctx.stroke();
}

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  points.push({ x: (sx - W/2) / 100, y: (H/2 - sy) / 100 });
  draw();
});

document.getElementById('btnStep').onclick = step;
document.getElementById('btnRun').onclick = () => {
  isRunning = !isRunning;
  document.getElementById('btnRun').innerText = isRunning ? "Pause" : "Run";
  if (isRunning) loop();
};
document.getElementById('btnReset').onclick = reset;
document.getElementById('sliderLr').oninput = (e) => {
  lr = parseFloat(e.target.value);
  document.getElementById('lblLr').innerText = lr.toFixed(3);
};

function loop() {
  if (isRunning) {
    step();
    requestAnimationFrame(loop);
  }
}

reset();

  </script>
</body>
</html>
