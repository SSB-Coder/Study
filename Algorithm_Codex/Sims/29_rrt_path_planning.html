<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RRT Path Planning — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }
    .header { text-align: center; max-width: 820px; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: #10b981; margin-bottom: 8px; }
    .desc { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .nav-bar { margin-top: 8px; margin-bottom: 16px; }
    .nav-bar a { color: #38bdf8; text-decoration: none; font-size: 0.85rem; border: 1px solid #1e293b; padding: 4px 12px; border-radius: 4px; }
    .sim-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; max-width: 860px; width: 100%; }
    canvas { background: #030712; border: 1px solid #374151; border-radius: 8px; margin-bottom: 16px; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; background: #1f2937; padding: 12px 18px; border-radius: 8px; width: 100%; }
    button { background: #059669; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #047857; }
    .status-text { margin-top: 12px; font-family: monospace; font-size: 0.95rem; color: #34d399; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Module X01: Rapidly-Exploring Random Trees (RRT)</h1>
    <p class="desc">Sampling-based path planning for high-dimensional robotic motion. Watch the tree explore space and route around circular obstacles!</p>
    <div class="nav-bar"><a href="index.html">&larr; Return to Simulation Hub</a></div>
  </div>
  <div class="sim-card">
    <canvas id="rrtCanvas" width="760" height="440"></canvas>
    <div class="controls">
      <button id="btnGrow">Step Tree (50 Nodes)</button>
      <button id="btnAuto">Auto Search to Goal</button>
      <button id="btnReset">Reset Environment</button>
    </div>
    <div class="status-text" id="statusText">Ready to explore.</div>
  </div>
  <script>
    const canvas = document.getElementById("rrtCanvas");
    const ctx = canvas.getContext("2d");

    const start = { x: 60, y: 380 };
    const goal = { x: 700, y: 60, r: 25 };
    const stepSize = 18;

    const obstacles = [
      { x: 260, y: 220, r: 65 },
      { x: 480, y: 150, r: 55 },
      { x: 420, y: 330, r: 70 },
      { x: 620, y: 260, r: 45 }
    ];

    let tree = [];
    let goalFound = false;

    function reset() {
      tree = [{ x: start.x, y: start.y, parent: -1 }];
      goalFound = false;
      document.getElementById("statusText").innerHTML = "Ready to explore.";
      draw();
    }
    reset();

    function distance(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }

    function inObstacle(x, y) {
      for (let obs of obstacles) {
        if (Math.hypot(x - obs.x, y - obs.y) <= obs.r) return true;
      }
      return false;
    }

    function growTree(samples = 50) {
      if (goalFound) return;
      for (let s = 0; s < samples; s++) {
        // Goal bias 10%
        const randX = Math.random() < 0.1 ? goal.x : Math.random() * canvas.width;
        const randY = Math.random() < 0.1 ? goal.y : Math.random() * canvas.height;

        let nearestIdx = 0;
        let minDist = Infinity;
        for (let i = 0; i < tree.length; i++) {
          const d = distance(tree[i], { x: randX, y: randY });
          if (d < minDist) { minDist = d; nearestIdx = i; }
        }

        const nearNode = tree[nearestIdx];
        const theta = Math.atan2(randY - nearNode.y, randX - nearNode.x);
        const newX = nearNode.x + stepSize * Math.cos(theta);
        const newY = nearNode.y + stepSize * Math.sin(theta);

        if (!inObstacle(newX, newY)) {
          const newNode = { x: newX, y: newY, parent: nearestIdx };
          tree.push(newNode);

          if (distance(newNode, goal) <= goal.r) {
            goalFound = true;
            document.getElementById("statusText").innerHTML =
              `<strong>Goal Reached! Path discovered in ${tree.length} nodes.</strong>`;
            break;
          }
        }
      }
      draw();
    }

    document.getElementById("btnGrow").onclick = () => growTree(50);
    document.getElementById("btnAuto").onclick = () => {
      let interval = setInterval(() => {
        growTree(30);
        if (goalFound || tree.length > 2500) clearInterval(interval);
      }, 30);
    };
    document.getElementById("btnReset").onclick = reset;

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Obstacles
      ctx.fillStyle = "rgba(239, 68, 68, 0.35)";
      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 1.5;
      obstacles.forEach(obs => {
        ctx.beginPath(); ctx.arc(obs.x, obs.y, obs.r, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
      });

      // Goal
      ctx.fillStyle = "rgba(16, 185, 129, 0.4)";
      ctx.strokeStyle = "#10b981";
      ctx.beginPath(); ctx.arc(goal.x, goal.y, goal.r, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();

      // Tree branches
      ctx.strokeStyle = "rgba(56, 189, 248, 0.5)";
      ctx.lineWidth = 1.2;
      for (let i = 1; i < tree.length; i++) {
        const node = tree[i];
        const parent = tree[node.parent];
        ctx.beginPath(); ctx.moveTo(parent.x, parent.y); ctx.lineTo(node.x, node.y); ctx.stroke();
      }

      // If goal reached, highlight solution path in gold
      if (goalFound) {
        ctx.strokeStyle = "#f59e0b";
        ctx.lineWidth = 4;
        let curr = tree[tree.length - 1];
        ctx.beginPath();
        ctx.moveTo(curr.x, curr.y);
        while (curr.parent !== -1) {
          curr = tree[curr.parent];
          ctx.lineTo(curr.x, curr.y);
        }
        ctx.stroke();
      }

      // Start node
      ctx.fillStyle = "#38bdf8";
      ctx.beginPath(); ctx.arc(start.x, start.y, 7, 0, 2 * Math.PI); ctx.fill();
    }
    draw();
  </script>
</body>
</html>
