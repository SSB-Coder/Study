<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canny Edge Detector Pipeline — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }
    .header { text-align: center; max-width: 820px; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: #38bdf8; margin-bottom: 8px; }
    .desc { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .nav-bar { margin-top: 8px; margin-bottom: 16px; }
    .nav-bar a { color: #38bdf8; text-decoration: none; font-size: 0.85rem; border: 1px solid #1e293b; padding: 4px 12px; border-radius: 4px; }
    .sim-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; max-width: 860px; width: 100%; }
    canvas { background: #030712; border: 1px solid #374151; border-radius: 8px; margin-bottom: 16px; image-rendering: pixelated; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; background: #1f2937; padding: 12px 18px; border-radius: 8px; width: 100%; }
    button { background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    button.active { background: #10b981; }
    .status-text { margin-top: 12px; font-family: monospace; font-size: 0.95rem; color: #38bdf8; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Module X10: Canny Edge Detection Multi-Stage Pipeline</h1>
    <p class="desc">Interactive step-by-step classical computer vision pipeline: Gaussian Smoothing &rarr; Sobel Gradient Magnitude &rarr; Non-Maximum Suppression (NMS) &rarr; Hysteresis Thresholding.</p>
    <div class="nav-bar"><a href="index.html">&larr; Return to Simulation Hub</a></div>
  </div>
  <div class="sim-card">
    <canvas id="cannyCanvas" width="280" height="280" style="width: 420px; height: 420px;"></canvas>
    <div class="controls">
      <button id="s1" class="active">1. Raw Image</button>
      <button id="s2">2. Gaussian Blur</button>
      <button id="s3">3. Sobel Gradients</button>
      <button id="s4">4. Non-Max Suppression</button>
      <button id="s5">5. Final Canny Edges</button>
    </div>
    <div class="status-text" id="statusText">Viewing: Raw Input Image</div>
  </div>
  <script>
    const canvas = document.getElementById("cannyCanvas");
    const ctx = canvas.getContext("2d");
    const W = 280, H = 280;

    // Generate test image (Geometric shapes: circle, square, triangle)
    const raw = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        let val = 30;
        // Square
        if (x >= 40 && x <= 120 && y >= 40 && y <= 120) val = 210;
        // Circle
        if (Math.hypot(x - 190, y - 180) < 55) val = 180;
        // Noise
        val += (Math.random() - 0.5) * 25;
        raw[y * W + x] = Math.max(0, Math.min(255, val));
      }
    }

    // 1. Gaussian Blur (5x5)
    const blurred = new Uint8Array(W * H);
    for (let y = 2; y < H - 2; y++) {
      for (let x = 2; x < W - 2; x++) {
        let acc = 0;
        for (let dy = -2; dy <= 2; dy++) {
          for (let dx = -2; dx <= 2; dx++) {
            acc += raw[(y + dy) * W + (x + dx)];
          }
        }
        blurred[y * W + x] = acc / 25;
      }
    }

    // 2. Sobel Gradients
    const mag = new Float32Array(W * H);
    const dir = new Float32Array(W * H);
    for (let y = 1; y < H - 1; y++) {
      for (let x = 1; x < W - 1; x++) {
        const gx = -blurred[(y-1)*W + x-1] + blurred[(y-1)*W + x+1]
                   -2*blurred[y*W + x-1]   + 2*blurred[y*W + x+1]
                   -blurred[(y+1)*W + x-1] + blurred[(y+1)*W + x+1];
        const gy = -blurred[(y-1)*W + x-1] - 2*blurred[(y-1)*W + x] - blurred[(y-1)*W + x+1]
                   +blurred[(y+1)*W + x-1] + 2*blurred[(y+1)*W + x] + blurred[(y+1)*W + x+1];
        mag[y * W + x] = Math.hypot(gx, gy);
        dir[y * W + x] = Math.atan2(gy, gx);
      }
    }

    // 3. Non-Maximum Suppression (NMS)
    const nms = new Float32Array(W * H);
    for (let y = 1; y < H - 1; y++) {
      for (let x = 1; x < W - 1; x++) {
        let angle = dir[y * W + x] * (180 / Math.PI);
        if (angle < 0) angle += 180;

        let q = 0, r = 0;
        if ((angle >= 0 && angle < 22.5) || (angle >= 157.5 && angle <= 180)) {
          q = mag[y * W + x + 1]; r = mag[y * W + x - 1];
        } else if (angle >= 22.5 && angle < 67.5) {
          q = mag[(y + 1) * W + x - 1]; r = mag[(y - 1) * W + x + 1];
        } else if (angle >= 67.5 && angle < 112.5) {
          q = mag[(y + 1) * W + x]; r = mag[(y - 1) * W + x];
        } else if (angle >= 112.5 && angle < 157.5) {
          q = mag[(y - 1) * W + x - 1]; r = mag[(y + 1) * W + x + 1];
        }

        const m = mag[y * W + x];
        nms[y * W + x] = (m >= q && m >= r) ? m : 0;
      }
    }

    // 4. Double Thresholding & Hysteresis
    const edges = new Uint8Array(W * H);
    const lowThresh = 45, highThresh = 110;
    for (let i = 0; i < W * H; i++) {
      if (nms[i] >= highThresh) edges[i] = 255;
      else if (nms[i] >= lowThresh) edges[i] = 120;
    }

    function renderStage(buf, isFloat = false) {
      const img = ctx.createImageData(W, H);
      const d = img.data;
      for (let i = 0; i < W * H; i++) {
        let val = isFloat ? Math.min(255, buf[i]) : buf[i];
        const p = i * 4;
        d[p] = val; d[p + 1] = val; d[p + 2] = val; d[p + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
    }

    const buttons = [
      { id: "s1", fn: () => { renderStage(raw); setDesc("Stage 1: Raw Grayscale Image with Noise"); } },
      { id: "s2", fn: () => { renderStage(blurred); setDesc("Stage 2: 5x5 Gaussian Kernel Smoothing"); } },
      { id: "s3", fn: () => { renderStage(mag, true); setDesc("Stage 3: Sobel Gradient Magnitude ||G||"); } },
      { id: "s4", fn: () => { renderStage(nms, true); setDesc("Stage 4: Non-Maximum Suppression (1-pixel thinned ridges)"); } },
      { id: "s5", fn: () => { renderStage(edges); setDesc("Stage 5: Dual Thresholding & Hysteresis Tracking"); } }
    ];

    function setDesc(txt) { document.getElementById("statusText").innerText = txt; }

    buttons.forEach(b => {
      document.getElementById(b.id).onclick = () => {
        buttons.forEach(o => document.getElementById(o.id).classList.remove("active"));
        document.getElementById(b.id).classList.add("active");
        b.fn();
      };
    });

    renderStage(raw);
  </script>
</body>
</html>
