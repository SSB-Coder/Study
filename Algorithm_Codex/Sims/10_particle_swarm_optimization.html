<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Swarm Optimization (PSO) — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .header {
      text-align: center;
      max-width: 800px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 8px;
    }
    .desc {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .nav-bar {
      margin-top: 8px;
      margin-bottom: 16px;
    }
    .nav-bar a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid #1e293b;
      padding: 4px 12px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .nav-bar a:hover {
      background: #1e293b;
    }
    .sim-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 1000px;
      width: 100%;
    }
    canvas {
      background: #030712;
      border: 1px solid #374151;
      border-radius: 8px;
      cursor: crosshair;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-top: 16px;
      width: 100%;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button.secondary {
      background: #374151;
    }
    button.secondary:hover { background: #4b5563; }
    .param-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    input[type="range"] {
      accent-color: #3b82f6;
    }
    .metrics-panel {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      font-size: 0.9rem;
      color: #a7f3d0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #0f172a;
      padding: 10px 20px;
      border-radius: 6px;
      border: 1px solid #1e293b;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Particle Swarm Optimization (PSO)</h1>
    <p class="desc">Module H: Swarm particles balancing cognitive memory and social consensus to find global minima.</p>
    <div class="nav-bar"><a href="index.html">← Back to All Visualizers</a></div>
  </div>

  <div class="sim-card">
    <canvas id="simCanvas" width="650" height="420"></canvas>
    
    <div class="controls">
      
<button id="btnStepPSO">Step Swarm</button>
<button id="btnRunPSO">Run Swarm</button>
<button id="btnResetPSO" class="secondary">Reset</button>

    </div>

    <div class="metrics-panel" id="metricsPanel">
      <span>Status: Ready</span>
    </div>
  </div>

  <script>
    
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let particles = [];
let gBest = {x: 0, y: 0, cost: Infinity};
let isRunning = false;
let stepCount = 0;

function f(x, y) {
  // Rastrigin-like landscape mapped to canvas
  let nx = (x - W/2) / 60, ny = (y - H/2) / 60;
  return 10 * 2 + (nx*nx - 10 * Math.cos(2 * Math.PI * nx)) + (ny*ny - 10 * Math.cos(2 * Math.PI * ny));
}

function reset() {
  particles = [];
  gBest = {x: 0, y: 0, cost: Infinity};
  stepCount = 0;

  for (let i = 0; i < 40; i++) {
    let px = 50 + Math.random() * (W - 100);
    let py = 50 + Math.random() * (H - 100);
    let c = f(px, py);
    let p = {
      x: px, y: py,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      pBestX: px, pBestY: py,
      pBestCost: c
    };
    if (c < gBest.cost) {
      gBest = { x: px, y: py, cost: c };
    }
    particles.push(p);
  }
  draw();
}

function stepPSO() {
  stepCount++;
  let w = 0.729, c1 = 1.494, c2 = 1.494;

  for (let p of particles) {
    let r1 = Math.random(), r2 = Math.random();
    p.vx = w * p.vx + c1 * r1 * (p.pBestX - p.x) + c2 * r2 * (gBest.x - p.x);
    p.vy = w * p.vy + c1 * r1 * (p.pBestY - p.y) + c2 * r2 * (gBest.y - p.y);

    p.x += p.vx;
    p.y += p.vy;

    let cost = f(p.x, p.y);
    if (cost < p.pBestCost) {
      p.pBestCost = cost;
      p.pBestX = p.x;
      p.pBestY = p.y;
      if (cost < gBest.cost) {
        gBest = { x: p.x, y: p.y, cost };
      }
    }
  }

  document.getElementById('metricsPanel').innerHTML = 
    `<span>Step: ${stepCount}</span><span>Swarm Global Best Cost: ${gBest.cost.toFixed(4)}</span>`;
  draw();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Draw target optimum at center
  ctx.strokeStyle = 'rgba(16, 185, 129, 0.4)';
  ctx.lineWidth = 1.5;
  for (let r = 20; r <= 160; r += 30) {
    ctx.beginPath(); ctx.arc(W/2, H/2, r, 0, Math.PI * 2); ctx.stroke();
  }

  // Draw particles
  for (let p of particles) {
    ctx.fillStyle = '#60a5fa';
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();

    // Velocity vector
    ctx.strokeStyle = 'rgba(147, 197, 253, 0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.vx * 3, p.y + p.vy * 3); ctx.stroke();
  }

  // Global best
  ctx.fillStyle = '#ef4444';
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(gBest.x, gBest.y, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
}

document.getElementById('btnStepPSO').onclick = stepPSO;
document.getElementById('btnRunPSO').onclick = () => {
  isRunning = !isRunning;
  document.getElementById('btnRunPSO').innerText = isRunning ? "Pause" : "Run";
  if (isRunning) loop();
};
document.getElementById('btnResetPSO').onclick = reset;

function loop() {
  if (isRunning) {
    stepPSO();
    requestAnimationFrame(loop);
  }
}

reset();

  </script>
</body>
</html>
