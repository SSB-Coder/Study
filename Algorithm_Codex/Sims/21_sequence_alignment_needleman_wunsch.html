<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Needleman-Wunsch Alignment — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }
    .header { text-align: center; max-width: 820px; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: #10b981; margin-bottom: 8px; }
    .desc { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .nav-bar { margin-top: 8px; margin-bottom: 16px; }
    .nav-bar a { color: #38bdf8; text-decoration: none; font-size: 0.85rem; border: 1px solid #1e293b; padding: 4px 12px; border-radius: 4px; }
    .sim-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; max-width: 860px; width: 100%; }
    canvas { background: #030712; border: 1px solid #374151; border-radius: 8px; margin-bottom: 16px; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; background: #1f2937; padding: 12px 18px; border-radius: 8px; width: 100%; }
    input[type=text] { background: #111827; color: white; border: 1px solid #4b5563; padding: 6px 10px; border-radius: 6px; font-family: monospace; font-size: 1rem; width: 140px; text-transform: uppercase; }
    .status-text { margin-top: 12px; font-family: monospace; font-size: 1rem; color: #34d399; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Module T01: Sequence Alignment (Needleman-Wunsch)</h1>
    <p class="desc">Dynamic programming matrix with glowing optimal backtracking path. Type your own DNA/RNA sequences to inspect global alignment!</p>
    <div class="nav-bar"><a href="index.html">&larr; Return to Simulation Hub</a></div>
  </div>
  <div class="sim-card">
    <canvas id="dpCanvas" width="740" height="420"></canvas>
    <div class="controls">
      <label>Seq 1: <input type="text" id="seq1" value="GATTACA"></label>
      <label>Seq 2: <input type="text" id="seq2" value="GCATGCG"></label>
      <label>Match: +1, Mismatch: -1, Gap: -1</label>
    </div>
    <div class="status-text" id="statusText">Alignment loading...</div>
  </div>
  <script>
    const canvas = document.getElementById("dpCanvas");
    const ctx = canvas.getContext("2d");
    const s1Input = document.getElementById("seq1");
    const s2Input = document.getElementById("seq2");

    s1Input.oninput = () => draw();
    s2Input.oninput = () => draw();

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const s1 = s1Input.value.trim().toUpperCase() || "A";
      const s2 = s2Input.value.trim().toUpperCase() || "A";
      const n = s1.length, m = s2.length;

      const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
      for (let i = 0; i <= n; i++) dp[i][0] = -i;
      for (let j = 0; j <= m; j++) dp[0][j] = -j;

      for (let i = 1; i <= n; i++) {
        for (let j = 1; j <= m; j++) {
          const match = dp[i - 1][j - 1] + (s1[i - 1] === s2[j - 1] ? 1 : -1);
          const del = dp[i - 1][j] - 1;
          const ins = dp[i][j - 1] - 1;
          dp[i][j] = Math.max(match, del, ins);
        }
      }

      // Backtrack
      let i = n, j = m;
      const path = [[i, j]];
      let a1 = "", a2 = "";
      while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && dp[i][j] === dp[i - 1][j - 1] + (s1[i - 1] === s2[j - 1] ? 1 : -1)) {
          a1 = s1[i - 1] + a1; a2 = s2[j - 1] + a2;
          i--; j--;
        } else if (i > 0 && dp[i][j] === dp[i - 1][j] - 1) {
          a1 = s1[i - 1] + a1; a2 = "-" + a2;
          i--;
        } else {
          a1 = "-" + a1; a2 = s2[j - 1] + a2;
          j--;
        }
        path.push([i, j]);
      }

      // Render DP grid
      const cellW = Math.min(48, (canvas.width - 120) / (m + 2));
      const cellH = Math.min(36, (canvas.height - 100) / (n + 2));
      const startX = 80, startY = 60;

      const pathSet = new Set(path.map(p => `${p[0]},${p[1]}`));

      for (let r = 0; r <= n; r++) {
        for (let c = 0; c <= m; c++) {
          const x = startX + c * cellW;
          const y = startY + r * cellH;
          const inPath = pathSet.has(`${r},${c}`);

          ctx.fillStyle = inPath ? "rgba(16, 185, 129, 0.3)" : "#1e293b";
          ctx.strokeStyle = inPath ? "#10b981" : "#334155";
          ctx.lineWidth = inPath ? 2 : 1;
          ctx.fillRect(x, y, cellW, cellH);
          ctx.strokeRect(x, y, cellW, cellH);

          ctx.fillStyle = inPath ? "#34d399" : "#cbd5e1";
          ctx.font = "bold 13px monospace";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(dp[r][c], x + cellW / 2, y + cellH / 2);
        }
      }

      // Draw sequence headers
      ctx.fillStyle = "#f59e0b";
      for (let c = 0; c < m; c++) {
        ctx.fillText(s2[c], startX + (c + 1) * cellW + cellW / 2, startY - 14);
      }
      for (let r = 0; r < n; r++) {
        ctx.fillText(s1[r], startX - 20, startY + (r + 1) * cellH + cellH / 2);
      }

      document.getElementById("statusText").innerHTML =
        `Score: <strong>${dp[n][m]}</strong> &nbsp;|&nbsp; Alignment: <code>${a1}</code> / <code>${a2}</code>`;
    }
    draw();
  </script>
</body>
</html>
