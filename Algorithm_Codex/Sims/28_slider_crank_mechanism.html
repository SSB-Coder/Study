<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slider-Crank Mechanism — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }
    .header { text-align: center; max-width: 820px; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: #38bdf8; margin-bottom: 8px; }
    .desc { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .nav-bar { margin-top: 8px; margin-bottom: 16px; }
    .nav-bar a { color: #38bdf8; text-decoration: none; font-size: 0.85rem; border: 1px solid #1e293b; padding: 4px 12px; border-radius: 4px; }
    .sim-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; max-width: 860px; width: 100%; }
    canvas { background: #030712; border: 1px solid #374151; border-radius: 8px; margin-bottom: 16px; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; background: #1f2937; padding: 12px 18px; border-radius: 8px; width: 100%; }
    .slider-group { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #cbd5e1; }
    .status-text { margin-top: 12px; font-family: monospace; font-size: 0.9rem; color: #38bdf8; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Module W12: Slider-Crank Multibody Dynamics</h1>
    <p class="desc">Kinematic engine mechanism: Crank rotation $	heta$ driven by angular velocity $\omega$ converting into linear piston stroke $x(	heta)$.</p>
    <div class="nav-bar"><a href="index.html">&larr; Return to Simulation Hub</a></div>
  </div>
  <div class="sim-card">
    <canvas id="crankCanvas" width="760" height="380"></canvas>
    <div class="controls">
      <div class="slider-group">
        <label>RPM: <input type="range" id="rpm" min="10" max="180" value="60"> <span id="vrpm">60</span></label>
      </div>
      <div class="slider-group">
        <label>Crank Radius (r): <input type="range" id="radius" min="40" max="90" value="70"> <span id="vrad">70</span></label>
      </div>
      <div class="slider-group">
        <label>Connecting Rod (L): <input type="range" id="rod" min="120" max="240" value="180"> <span id="vrod">180</span></label>
      </div>
    </div>
    <div class="status-text" id="statusText">Kinematics active.</div>
  </div>
  <script>
    const canvas = document.getElementById("crankCanvas");
    const ctx = canvas.getContext("2d");
    let theta = 0;

    function render() {
      const rpm = parseFloat(document.getElementById("rpm").value);
      const r = parseFloat(document.getElementById("radius").value);
      const L = parseFloat(document.getElementById("rod").value);

      document.getElementById("vrpm").innerText = rpm;
      document.getElementById("vrad").innerText = r;
      document.getElementById("vrod").innerText = L;

      const omega = (rpm * 2 * Math.PI) / 60;
      theta += omega * 0.016;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = 240, cy = 190;
      // Crank pin (A)
      const ax = cx + r * Math.cos(theta);
      const ay = cy + r * Math.sin(theta);

      // Piston pin (B) on horizontal axis (y = cy)
      // (bx - ax)^2 + (cy - ay)^2 = L^2 -> bx = ax + sqrt(L^2 - (ay - cy)^2)
      const dy = ay - cy;
      const bx = ax + Math.sqrt(L * L - dy * dy);
      const by = cy;

      // Draw Crankshaft guide circle
      ctx.strokeStyle = "#334155"; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.stroke();
      ctx.setLineDash([]);

      // Piston cylinder guide track
      ctx.strokeStyle = "#475569"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx + r + 20, cy - 35); ctx.lineTo(cx + r + L + 60, cy - 35); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + r + 20, cy + 35); ctx.lineTo(cx + r + L + 60, cy + 35); ctx.stroke();

      // Crank arm (Central shaft to Crank pin A)
      ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 6; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ax, ay); ctx.stroke();

      // Connecting rod (A to B)
      ctx.strokeStyle = "#f59e0b"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();

      // Piston block
      const pw = 50, ph = 40;
      ctx.fillStyle = "#10b981";
      ctx.fillRect(bx - pw / 2, by - ph / 2, pw, ph);

      // Pivot joints
      ctx.fillStyle = "#ffffff";
      [[cx, cy], [ax, ay], [bx, by]].forEach(([px, py]) => {
        ctx.beginPath(); ctx.arc(px, py, 5, 0, 2 * Math.PI); ctx.fill();
      });

      const pistonDisp = bx - (cx + r + L);
      document.getElementById("statusText").innerHTML =
        `Crank Angle: ${(theta % (2*Math.PI) * 180 / Math.PI).toFixed(1)}&deg; &nbsp;|&nbsp; Piston Position x: <strong>${bx.toFixed(1)} px</strong>`;

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
