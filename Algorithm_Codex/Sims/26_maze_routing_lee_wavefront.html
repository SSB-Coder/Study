<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lee Maze Routing — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }
    .header { text-align: center; max-width: 820px; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: #38bdf8; margin-bottom: 8px; }
    .desc { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .nav-bar { margin-top: 8px; margin-bottom: 16px; }
    .nav-bar a { color: #38bdf8; text-decoration: none; font-size: 0.85rem; border: 1px solid #1e293b; padding: 4px 12px; border-radius: 4px; }
    .sim-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; max-width: 860px; width: 100%; }
    canvas { background: #030712; border: 1px solid #374151; border-radius: 8px; margin-bottom: 16px; cursor: pointer; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; background: #1f2937; padding: 12px 18px; border-radius: 8px; width: 100%; }
    button { background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    .status-text { margin-top: 12px; font-family: monospace; font-size: 0.95rem; color: #38bdf8; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Module W01: VLSI Maze Routing (Lee's BFS Algorithm)</h1>
    <p class="desc">Wavefront expansion on an integrated circuit layout grid. Click cells to toggle obstacles, then watch optimal path routing!</p>
    <div class="nav-bar"><a href="index.html">&larr; Return to Simulation Hub</a></div>
  </div>
  <div class="sim-card">
    <canvas id="leeCanvas" width="560" height="420"></canvas>
    <div class="controls">
      <button id="runWave">Run Lee Wavefront</button>
      <button id="clearWalls">Clear Walls</button>
      <button id="randomMaze">Random Obstacles</button>
    </div>
    <div class="status-text" id="statusText">Click grid to draw obstacles.</div>
  </div>
  <script>
    const canvas = document.getElementById("leeCanvas");
    const ctx = canvas.getContext("2d");
    const cols = 28, rows = 21;
    const cellW = canvas.width / cols, cellH = canvas.height / rows;

    let walls = new Uint8Array(cols * rows);
    let start = { x: 3, y: 10 };
    let target = { x: 24, y: 10 };
    let wave = new Int32Array(cols * rows).fill(-1);
    let path = [];

    function solveLee() {
      wave.fill(-1); path = [];
      const queue = [{ x: start.x, y: start.y, d: 0 }];
      wave[start.y * cols + start.x] = 0;

      let found = false;
      while (queue.length > 0) {
        const { x, y, d } = queue.shift();
        if (x === target.x && y === target.y) { found = true; break; }

        for (let [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
            const idx = ny * cols + nx;
            if (walls[idx] === 0 && wave[idx] === -1) {
              wave[idx] = d + 1;
              queue.push({ x: nx, y: ny, d: d + 1 });
            }
          }
        }
      }

      if (found) {
        let curr = { x: target.x, y: target.y };
        path.push(curr);
        while (curr.x !== start.x || curr.y !== start.y) {
          const d = wave[curr.y * cols + curr.x];
          for (let [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
            const nx = curr.x + dx, ny = curr.y + dy;
            if (nx >= 0 && nx < cols && ny >= 0 && ny < rows && wave[ny * cols + nx] === d - 1) {
              curr = { x: nx, y: ny };
              path.push(curr);
              break;
            }
          }
        }
        document.getElementById("statusText").innerHTML = `Optimal wire length: <strong>${path.length - 1} grid units</strong>`;
      } else {
        document.getElementById("statusText").innerHTML = `<span style="color:#ef4444">No route feasible!</span>`;
      }
      draw();
    }

    canvas.onclick = e => {
      const rect = canvas.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / cellW) | 0;
      const y = ((e.clientY - rect.top) / cellH) | 0;
      if ((x !== start.x || y !== start.y) && (x !== target.x || y !== target.y)) {
        walls[y * cols + x] = 1 - walls[y * cols + x];
        solveLee();
      }
    };

    document.getElementById("runWave").onclick = solveLee;
    document.getElementById("clearWalls").onclick = () => { walls.fill(0); solveLee(); };
    document.getElementById("randomMaze").onclick = () => {
      walls.fill(0);
      for (let i = 0; i < walls.length; i++) {
        if (Math.random() < 0.22) walls[i] = 1;
      }
      walls[start.y * cols + start.x] = 0;
      walls[target.y * cols + target.x] = 0;
      solveLee();
    };

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const pathSet = new Set(path.map(p => `${p.x},${p.y}`));

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const idx = y * cols + x;
          const px = x * cellW, py = y * cellH;

          if (walls[idx]) {
            ctx.fillStyle = "#334155";
          } else if (pathSet.has(`${x},${y}`)) {
            ctx.fillStyle = "#f59e0b";
          } else if (wave[idx] >= 0) {
            const hue = (wave[idx] * 12) % 360;
            ctx.fillStyle = `hsl(${hue}, 70%, 25%)`;
          } else {
            ctx.fillStyle = "#0f172a";
          }
          ctx.fillRect(px, py, cellW - 1, cellH - 1);
        }
      }

      // Start & Target markers
      ctx.fillStyle = "#10b981"; ctx.fillRect(start.x * cellW, start.y * cellH, cellW - 1, cellH - 1);
      ctx.fillStyle = "#ef4444"; ctx.fillRect(target.x * cellW, target.y * cellH, cellW - 1, cellH - 1);
    }
    solveLee();
  </script>
</body>
</html>
