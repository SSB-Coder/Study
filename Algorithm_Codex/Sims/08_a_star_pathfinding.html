<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A* Heuristic Pathfinding — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .header {
      text-align: center;
      max-width: 800px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 8px;
    }
    .desc {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .nav-bar {
      margin-top: 8px;
      margin-bottom: 16px;
    }
    .nav-bar a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid #1e293b;
      padding: 4px 12px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .nav-bar a:hover {
      background: #1e293b;
    }
    .sim-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 1000px;
      width: 100%;
    }
    canvas {
      background: #030712;
      border: 1px solid #374151;
      border-radius: 8px;
      cursor: crosshair;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-top: 16px;
      width: 100%;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button.secondary {
      background: #374151;
    }
    button.secondary:hover { background: #4b5563; }
    .param-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    input[type="range"] {
      accent-color: #3b82f6;
    }
    .metrics-panel {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      font-size: 0.9rem;
      color: #a7f3d0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #0f172a;
      padding: 10px 20px;
      border-radius: 6px;
      border: 1px solid #1e293b;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>A* Heuristic Pathfinding</h1>
    <p class="desc">Module L: Manhattan heuristic search exploring nodes to find the shortest obstacle-free path.</p>
    <div class="nav-bar"><a href="index.html">← Back to All Visualizers</a></div>
  </div>

  <div class="sim-card">
    <canvas id="simCanvas" width="660" height="440"></canvas>
    
    <div class="controls">
      
<button id="btnFindPath">Compute A* Path</button>
<button id="btnClearWalls">Clear Walls</button>
<div class="param-group"><span>Click & drag to draw obstacle walls!</span></div>

    </div>

    <div class="metrics-panel" id="metricsPanel">
      <span>Status: Ready</span>
    </div>
  </div>

  <script>
    
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const R = 20, C = 30;
const cellW = W / C, cellH = H / R;

let grid = Array.from({length: R}, () => new Array(C).fill(0));
let start = {r: 2, c: 3};
let goal = {r: 17, c: 26};
let path = [];
let visited = [];

function clearWalls() {
  grid = Array.from({length: R}, () => new Array(C).fill(0));
  path = [];
  visited = [];
  draw();
}

function runAStar() {
  path = [];
  visited = [];

  let openSet = [{ r: start.r, c: start.c, f: 0, g: 0, parent: null }];
  let gScores = {};
  gScores[`${start.r},${start.c}`] = 0;
  let closed = new Set();

  function h(r, c) { return Math.abs(r - goal.r) + Math.abs(c - goal.c); }

  while (openSet.length > 0) {
    openSet.sort((a, b) => a.f - b.f);
    let curr = openSet.shift();
    let key = `${curr.r},${curr.c}`;

    if (curr.r === goal.r && curr.c === goal.c) {
      // Reconstruct
      let p = curr;
      while (p) {
        path.push({r: p.r, c: p.c});
        p = p.parent;
      }
      break;
    }

    if (closed.has(key)) continue;
    closed.add(key);
    visited.push({r: curr.r, c: curr.c});

    const moves = [[-1,0],[1,0],[0,-1],[0,1]];
    for (let [dr, dc] of moves) {
      let nr = curr.r + dr, nc = curr.c + dc;
      if (nr < 0 || nr >= R || nc < 0 || nc >= C || grid[nr][nc] === 1) continue;
      let nKey = `${nr},${nc}`;
      if (closed.has(nKey)) continue;

      let tentG = curr.g + 1;
      if (tentG < (gScores[nKey] ?? Infinity)) {
        gScores[nKey] = tentG;
        openSet.push({ r: nr, c: nc, g: tentG, f: tentG + h(nr, nc), parent: curr });
      }
    }
  }

  document.getElementById('metricsPanel').innerHTML = 
    `<span>Nodes Explored: ${visited.length}</span><span>Optimal Path Length: ${path.length} steps</span>`;
  draw();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Draw grid
  for (let r = 0; r < R; r++) {
    for (let c = 0; c < C; c++) {
      let x = c * cellW, y = r * cellH;
      if (grid[r][c] === 1) {
        ctx.fillStyle = '#374151'; // Wall
      } else {
        ctx.fillStyle = '#0f172a';
      }
      ctx.fillRect(x, y, cellW, cellH);
      ctx.strokeStyle = '#1e293b';
      ctx.strokeRect(x, y, cellW, cellH);
    }
  }

  // Draw visited
  ctx.fillStyle = 'rgba(59, 130, 246, 0.25)';
  for (let v of visited) {
    ctx.fillRect(v.c * cellW, v.r * cellH, cellW, cellH);
  }

  // Draw path
  ctx.fillStyle = '#f59e0b';
  for (let p of path) {
    ctx.fillRect(p.c * cellW + 2, p.r * cellH + 2, cellW - 4, cellH - 4);
  }

  // Start & Goal
  ctx.fillStyle = '#10b981';
  ctx.fillRect(start.c * cellW, start.r * cellH, cellW, cellH);
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(goal.c * cellW, goal.r * cellH, cellW, cellH);
}

let isMouseDown = false;
canvas.addEventListener('mousedown', () => isMouseDown = true);
window.addEventListener('mouseup', () => isMouseDown = false);
canvas.addEventListener('mousemove', (e) => {
  if (!isMouseDown) return;
  let rect = canvas.getBoundingClientRect();
  let c = Math.floor((e.clientX - rect.left) / cellW);
  let r = Math.floor((e.clientY - rect.top) / cellH);
  if (r >= 0 && r < R && c >= 0 && c < C) {
    if (!(r === start.r && c === start.c) && !(r === goal.r && c === goal.c)) {
      grid[r][c] = 1;
      draw();
    }
  }
});

document.getElementById('btnFindPath').onclick = runAStar;
document.getElementById('btnClearWalls').onclick = clearWalls;

// Default wall
for (let r = 5; r < 15; r++) grid[r][15] = 1;
runAStar();

  </script>
</body>
</html>
