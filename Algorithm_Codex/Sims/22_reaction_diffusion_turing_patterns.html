<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reaction-Diffusion Turing Patterns — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }
    .header { text-align: center; max-width: 820px; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: #ec4899; margin-bottom: 8px; }
    .desc { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .nav-bar { margin-top: 8px; margin-bottom: 16px; }
    .nav-bar a { color: #38bdf8; text-decoration: none; font-size: 0.85rem; border: 1px solid #1e293b; padding: 4px 12px; border-radius: 4px; }
    .sim-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; max-width: 860px; width: 100%; }
    canvas { background: #030712; border: 1px solid #374151; border-radius: 8px; margin-bottom: 16px; image-rendering: pixelated; cursor: crosshair; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; background: #1f2937; padding: 12px 18px; border-radius: 8px; width: 100%; }
    button { background: #db2777; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #be185d; }
    .status-text { margin-top: 12px; font-family: monospace; font-size: 0.9rem; color: #f472b6; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Module T06: Gray-Scott Reaction-Diffusion Turing Lab</h1>
    <p class="desc">Morphogenetic nonlinear PDE simulation. Drag your mouse to inject activator drops and trigger emergent biological patterns!</p>
    <div class="nav-bar"><a href="index.html">&larr; Return to Simulation Hub</a></div>
  </div>
  <div class="sim-card">
    <canvas id="rdCanvas" width="200" height="200" style="width: 440px; height: 440px;"></canvas>
    <div class="controls">
      <button id="presetSpots">Spots / Cheetah</button>
      <button id="presetStripes">Stripes / Zebra</button>
      <button id="presetSpirals">Spirals / Mitosis</button>
      <button id="resetRD">Reset Soup</button>
    </div>
    <div class="status-text" id="statusText">Simulation active. Morphogenesis unfolding...</div>
  </div>
  <script>
    const canvas = document.getElementById("rdCanvas");
    const ctx = canvas.getContext("2d");
    const W = 200, H = 200;
    const imgData = ctx.createImageData(W, H);

    let u = new Float32Array(W * H).fill(1.0);
    let v = new Float32Array(W * H).fill(0.0);
    let nextU = new Float32Array(W * H);
    let nextV = new Float32Array(W * H);

    let Du = 0.16, Dv = 0.08;
    let F = 0.035, K = 0.065; // spots

    function seed() {
      u.fill(1.0); v.fill(0.0);
      for (let y = 85; y < 115; y++) {
        for (let x = 85; x < 115; x++) {
          if (Math.random() < 0.8) {
            u[y * W + x] = 0.5;
            v[y * W + x] = 0.25;
          }
        }
      }
    }
    seed();

    document.getElementById("presetSpots").onclick = () => { F = 0.035; K = 0.065; seed(); };
    document.getElementById("presetStripes").onclick = () => { F = 0.040; K = 0.060; seed(); };
    document.getElementById("presetSpirals").onclick = () => { F = 0.025; K = 0.055; seed(); };
    document.getElementById("resetRD").onclick = seed;

    let isDrawing = false;
    canvas.onmousedown = () => isDrawing = true;
    window.onmouseup = () => isDrawing = false;
    canvas.onmousemove = e => {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      const cx = ((e.clientX - rect.left) / rect.width * W) | 0;
      const cy = ((e.clientY - rect.top) / rect.height * H) | 0;
      for (let dy = -6; dy <= 6; dy++) {
        for (let dx = -6; dx <= 6; dx++) {
          const x = (cx + dx + W) % W, y = (cy + dy + H) % H;
          v[y * W + x] = 0.5;
        }
      }
    };

    function step() {
      for (let y = 0; y < H; y++) {
        const ym1 = ((y - 1 + H) % H) * W;
        const yp1 = ((y + 1) % H) * W;
        const y0 = y * W;

        for (let x = 0; x < W; x++) {
          const xm1 = (x - 1 + W) % W;
          const xp1 = (x + 1) % W;
          const idx = y0 + x;

          const uVal = u[idx], vVal = v[idx];
          const lapU = (u[y0 + xm1] + u[y0 + xp1] + u[ym1 + x] + u[yp1 + x] - 4 * uVal);
          const lapV = (v[y0 + xm1] + v[y0 + xp1] + v[ym1 + x] + v[yp1 + x] - 4 * vVal);

          const uvv = uVal * vVal * vVal;
          nextU[idx] = uVal + (Du * lapU - uvv + F * (1.0 - uVal));
          nextV[idx] = vVal + (Dv * lapV + uvv - (F + K) * vVal);
        }
      }
      u.set(nextU); v.set(nextV);
    }

    function render() {
      for (let i = 0; i < 8; i++) step();

      const d = imgData.data;
      for (let i = 0; i < W * H; i++) {
        const val = v[i];
        const r = Math.min(255, (val * 850) | 0);
        const g = Math.min(255, (val * 350) | 0);
        const b = Math.min(255, (val * 600 + 40) | 0);

        const p = i * 4;
        d[p] = r; d[p + 1] = g; d[p + 2] = b; d[p + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
