<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Vector Machines (SVM) — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .header {
      text-align: center;
      max-width: 800px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 8px;
    }
    .desc {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .nav-bar {
      margin-top: 8px;
      margin-bottom: 16px;
    }
    .nav-bar a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid #1e293b;
      padding: 4px 12px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .nav-bar a:hover {
      background: #1e293b;
    }
    .sim-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 1000px;
      width: 100%;
    }
    canvas {
      background: #030712;
      border: 1px solid #374151;
      border-radius: 8px;
      cursor: crosshair;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-top: 16px;
      width: 100%;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button.secondary {
      background: #374151;
    }
    button.secondary:hover { background: #4b5563; }
    .param-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    input[type="range"] {
      accent-color: #3b82f6;
    }
    .metrics-panel {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      font-size: 0.9rem;
      color: #a7f3d0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #0f172a;
      padding: 10px 20px;
      border-radius: 6px;
      border: 1px solid #1e293b;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Support Vector Machines (SVM)</h1>
    <p class="desc">Module B: Maximum margin hyperplane visualizer with support vector boundaries and margin tuning.</p>
    <div class="nav-bar"><a href="index.html">← Back to All Visualizers</a></div>
  </div>

  <div class="sim-card">
    <canvas id="simCanvas" width="650" height="420"></canvas>
    
    <div class="controls">
      
<button id="btnSolve">Solve Margin</button>
<button id="btnRandom">Random Points</button>
<div class="param-group">
  <label>Margin Width (C scale):</label>
  <input type="range" id="sliderC" min="10" max="50" step="2" value="25">
  <span id="lblC">25</span>
</div>

    </div>

    <div class="metrics-panel" id="metricsPanel">
      <span>Status: Ready</span>
    </div>
  </div>

  <script>
    
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let points = [];
let marginW = 25;
let line = { w1: 1, w2: -1, b: 0 };

function init() {
  points = [];
  for (let i = 0; i < 15; i++) {
    points.push({ x: 80 + Math.random() * 200, y: 80 + Math.random() * 180, label: 1 });
    points.push({ x: 320 + Math.random() * 200, y: 220 + Math.random() * 180, label: -1 });
  }
  solve();
}

function solve() {
  // Simple heuristic linear separator between cluster centers
  let p1 = points.filter(p => p.label === 1);
  let p2 = points.filter(p => p.label === -1);
  let c1x = p1.reduce((s, p) => s + p.x, 0) / p1.length;
  let c1y = p1.reduce((s, p) => s + p.y, 0) / p1.length;
  let c2x = p2.reduce((s, p) => s + p.x, 0) / p2.length;
  let c2y = p2.reduce((s, p) => s + p.y, 0) / p2.length;

  let dx = c2x - c1x, dy = c2y - c1y;
  let len = Math.hypot(dx, dy);
  line.w1 = dx / len;
  line.w2 = dy / len;
  line.b = - (line.w1 * (c1x + c2x)/2 + line.w2 * (c1y + c2y)/2);

  document.getElementById('metricsPanel').innerHTML = 
    `<span>Status: Margin Solved</span><span>Hyperplane Normal: (${line.w1.toFixed(2)}, ${line.w2.toFixed(2)})</span><span>Margin: ${marginW}px</span>`;
  draw();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Draw margins
  ctx.fillStyle = 'rgba(59, 130, 246, 0.08)';
  // Main separator: w1 x + w2 y + b = 0 -> y = (-b - w1 x) / w2
  function getY(x, offset) { return (-line.b + offset - line.w1 * x) / line.w2; }

  // Draw margin slab
  ctx.beginPath();
  ctx.moveTo(0, getY(0, -marginW));
  ctx.lineTo(W, getY(W, -marginW));
  ctx.lineTo(W, getY(W, marginW));
  ctx.lineTo(0, getY(0, marginW));
  ctx.closePath();
  ctx.fill();

  // Draw lines
  ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(0, getY(0, 0)); ctx.lineTo(W, getY(W, 0)); ctx.stroke();

  ctx.strokeStyle = '#93c5fd'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(0, getY(0, -marginW)); ctx.lineTo(W, getY(W, -marginW)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, getY(0, marginW)); ctx.lineTo(W, getY(W, marginW)); ctx.stroke();
  ctx.setLineDash([]);

  // Draw points
  for (let p of points) {
    ctx.fillStyle = p.label === 1 ? '#3b82f6' : '#ef4444';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

document.getElementById('btnSolve').onclick = solve;
document.getElementById('btnRandom').onclick = init;
document.getElementById('sliderC').oninput = (e) => {
  marginW = parseInt(e.target.value);
  document.getElementById('lblC').innerText = marginW;
  draw();
};

init();

  </script>
</body>
</html>
