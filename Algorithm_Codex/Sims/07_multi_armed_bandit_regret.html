<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Armed Bandit (UCB1) — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .header {
      text-align: center;
      max-width: 800px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 8px;
    }
    .desc {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .nav-bar {
      margin-top: 8px;
      margin-bottom: 16px;
    }
    .nav-bar a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid #1e293b;
      padding: 4px 12px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .nav-bar a:hover {
      background: #1e293b;
    }
    .sim-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 1000px;
      width: 100%;
    }
    canvas {
      background: #030712;
      border: 1px solid #374151;
      border-radius: 8px;
      cursor: crosshair;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-top: 16px;
      width: 100%;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button.secondary {
      background: #374151;
    }
    button.secondary:hover { background: #4b5563; }
    .param-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    input[type="range"] {
      accent-color: #3b82f6;
    }
    .metrics-panel {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      font-size: 0.9rem;
      color: #a7f3d0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #0f172a;
      padding: 10px 20px;
      border-radius: 6px;
      border: 1px solid #1e293b;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Multi-Armed Bandit (UCB1)</h1>
    <p class="desc">Module G: 5 slot machines balancing exploration vs exploitation with Upper Confidence Bounds.</p>
    <div class="nav-bar"><a href="index.html">← Back to All Visualizers</a></div>
  </div>

  <div class="sim-card">
    <canvas id="simCanvas" width="650" height="380"></canvas>
    
    <div class="controls">
      
<button id="btnPull10">Pull 10 Steps</button>
<button id="btnPull100">Pull 100 Steps</button>
<button id="btnResetBandit" class="secondary">Reset</button>

    </div>

    <div class="metrics-panel" id="metricsPanel">
      <span>Status: Ready</span>
    </div>
  </div>

  <script>
    
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const K = 5;
const trueMeans = [0.2, 0.4, 0.85, 0.5, 0.3];
let counts = new Array(K).fill(0);
let rewards = new Array(K).fill(0);
let totalPulls = 0;

function reset() {
  counts = new Array(K).fill(0);
  rewards = new Array(K).fill(0);
  totalPulls = 0;
  draw();
}

function pullUCB() {
  totalPulls++;
  // Try each once
  let chosen = -1;
  for (let a = 0; a < K; a++) {
    if (counts[a] === 0) { chosen = a; break; }
  }

  if (chosen === -1) {
    let maxUCB = -Infinity;
    for (let a = 0; a < K; a++) {
      let q = rewards[a] / counts[a];
      let bonus = Math.sqrt((2 * Math.log(totalPulls)) / counts[a]);
      let ucb = q + bonus;
      if (ucb > maxUCB) { maxUCB = ucb; chosen = a; }
    }
  }

  let r = Math.random() < trueMeans[chosen] ? 1.0 : 0.0;
  counts[chosen]++;
  rewards[chosen] += r;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  let barW = (W - 100) / K;

  for (let a = 0; a < K; a++) {
    let x = 50 + a * barW;
    let empMean = counts[a] > 0 ? (rewards[a] / counts[a]) : 0;
    let barH = empMean * (H - 140);
    let trueH = trueMeans[a] * (H - 140);

    // True mean line
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(x + 5, H - 60 - trueH);
    ctx.lineTo(x + barW - 15, H - 60 - trueH);
    ctx.stroke();
    ctx.setLineDash([]);

    // Empirical bar
    ctx.fillStyle = a === 2 ? '#10b981' : '#3b82f6';
    ctx.fillRect(x + 10, H - 60 - barH, barW - 30, barH);

    // Labels
    ctx.fillStyle = '#f8fafc';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`Arm ${a}`, x + barW/2 - 5, H - 40);
    ctx.fillText(`Pulls: ${counts[a]}`, x + barW/2 - 5, H - 25);
    ctx.fillText(`Q: ${empMean.toFixed(2)}`, x + barW/2 - 5, H - 10);
  }

  let optPct = totalPulls > 0 ? ((counts[2] / totalPulls) * 100).toFixed(1) : "0.0";
  document.getElementById('metricsPanel').innerHTML = 
    `<span>Total Pulls: ${totalPulls}</span><span>Optimal Arm #2 Pulls: ${optPct}%</span><span>Best Arm True p: 0.85</span>`;
}

document.getElementById('btnPull10').onclick = () => { for(let i=0; i<10; i++) pullUCB(); draw(); };
document.getElementById('btnPull100').onclick = () => { for(let i=0; i<100; i++) pullUCB(); draw(); };
document.getElementById('btnResetBandit').onclick = reset;

reset();

  </script>
</body>
</html>
