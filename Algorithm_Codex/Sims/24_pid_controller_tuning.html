<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PID Controller Tuning — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }
    .header { text-align: center; max-width: 820px; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: #10b981; margin-bottom: 8px; }
    .desc { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .nav-bar { margin-top: 8px; margin-bottom: 16px; }
    .nav-bar a { color: #38bdf8; text-decoration: none; font-size: 0.85rem; border: 1px solid #1e293b; padding: 4px 12px; border-radius: 4px; }
    .sim-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; max-width: 860px; width: 100%; }
    canvas { background: #030712; border: 1px solid #374151; border-radius: 8px; margin-bottom: 16px; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; background: #1f2937; padding: 12px 18px; border-radius: 8px; width: 100%; }
    .slider-group { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #cbd5e1; }
    button { background: #059669; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #047857; }
    .status-text { margin-top: 12px; font-family: monospace; font-size: 0.9rem; color: #34d399; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Module U03: Interactive PID Controller Simulator</h1>
    <p class="desc">Closed-loop step response of a 2nd-order dynamical plant. Adjust $K_p$, $K_i$, $K_d$ to optimize rise time, damp oscillations, and extinguish steady-state offset!</p>
    <div class="nav-bar"><a href="index.html">&larr; Return to Simulation Hub</a></div>
  </div>
  <div class="sim-card">
    <canvas id="pidCanvas" width="760" height="380"></canvas>
    <div class="controls">
      <div class="slider-group">
        <label>Kp (Proportional): <input type="range" id="kp" min="0" max="30" step="0.5" value="6"> <span id="vkp">6.0</span></label>
      </div>
      <div class="slider-group">
        <label>Ki (Integral): <input type="range" id="ki" min="0" max="10" step="0.1" value="1.2"> <span id="vki">1.2</span></label>
      </div>
      <div class="slider-group">
        <label>Kd (Derivative): <input type="range" id="kd" min="0" max="15" step="0.2" value="2.5"> <span id="vkd">2.5</span></label>
      </div>
      <button id="addKick">Inject Disturbance Impulse</button>
    </div>
    <div class="status-text" id="statusText">Response tracking...</div>
  </div>
  <script>
    const canvas = document.getElementById("pidCanvas");
    const ctx = canvas.getContext("2d");

    let history = [];
    const maxLen = 350;
    let y = 0, v = 0;
    let integral = 0, prevError = 0;
    const setpoint = 1.0;
    let disturbance = 0;

    document.getElementById("addKick").onclick = () => { disturbance = -1.5; };

    function stepPhysics(dt = 0.04) {
      const kp = parseFloat(document.getElementById("kp").value);
      const ki = parseFloat(document.getElementById("ki").value);
      const kd = parseFloat(document.getElementById("kd").value);

      document.getElementById("vkp").innerText = kp.toFixed(1);
      document.getElementById("vki").innerText = ki.toFixed(1);
      document.getElementById("vkd").innerText = kd.toFixed(1);

      const error = setpoint - y;
      integral += error * dt;
      integral = Math.max(-3, Math.min(3, integral)); // anti-windup
      const derivative = (error - prevError) / dt;
      prevError = error;

      let u = kp * error + ki * integral + kd * derivative + disturbance;
      disturbance *= 0.92; // decay

      // Plant: 2nd order mass-spring-damper (d2y/dt2 + 2*zeta*w*dy/dt + w^2*y = u)
      const accel = u - 1.2 * v - 1.0 * y;
      v += accel * dt;
      y += v * dt;

      history.push(y);
      if (history.length > maxLen) history.shift();
    }

    function render() {
      stepPhysics();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const padX = 60, padY = 50;
      const plotW = canvas.width - 2 * padX;
      const plotH = canvas.height - 2 * padY;
      const zeroY = padY + plotH * 0.8;
      const scaleY = plotH * 0.5;

      // Draw Grid & Setpoint line (Target = 1.0)
      const spY = zeroY - setpoint * scaleY;
      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 6]);
      ctx.beginPath(); ctx.moveTo(padX, spY); ctx.lineTo(padX + plotW, spY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#ef4444"; ctx.font = "12px monospace";
      ctx.fillText("Setpoint (1.0)", padX + plotW - 110, spY - 6);

      // Draw Response trajectory
      ctx.strokeStyle = "#10b981";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (let i = 0; i < history.length; i++) {
        const px = padX + (i / maxLen) * plotW;
        const py = zeroY - history[i] * scaleY;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();

      const lastY = history[history.length - 1] || 0;
      const steadyErr = Math.abs(setpoint - lastY);
      document.getElementById("statusText").innerHTML =
        `Current Output: <strong>${lastY.toFixed(3)}</strong> &nbsp;|&nbsp; Error: ${steadyErr.toFixed(4)}`;

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
