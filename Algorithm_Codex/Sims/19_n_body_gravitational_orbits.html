<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>N-Body Gravitational Orbits — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }
    .header { text-align: center; max-width: 820px; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: #38bdf8; margin-bottom: 8px; }
    .desc { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .nav-bar { margin-top: 8px; margin-bottom: 16px; }
    .nav-bar a { color: #38bdf8; text-decoration: none; font-size: 0.85rem; border: 1px solid #1e293b; padding: 4px 12px; border-radius: 4px; }
    .sim-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; max-width: 860px; width: 100%; }
    canvas { background: #020617; border: 1px solid #374151; border-radius: 8px; margin-bottom: 16px; cursor: crosshair; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; background: #1f2937; padding: 12px 18px; border-radius: 8px; width: 100%; }
    button { background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    .slider-group { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #cbd5e1; }
    .status-text { margin-top: 12px; font-family: monospace; font-size: 0.9rem; color: #38bdf8; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Module S01: N-Body Gravitational Simulation</h1>
    <p class="desc">Symplectic velocity-Verlet integration of celestial gravitational dynamics. Click anywhere on the cosmos to inject a new orbiting mass!</p>
    <div class="nav-bar"><a href="index.html">&larr; Return to Simulation Hub</a></div>
  </div>
  <div class="sim-card">
    <canvas id="nbodyCanvas" width="760" height="460"></canvas>
    <div class="controls">
      <button id="presetFigure8">Figure-8 Choreography</button>
      <button id="presetSolar">Solar Keplerian System</button>
      <button id="presetChaos">Chaotic 4-Body</button>
      <button id="clearTrails">Clear Trails</button>
      <div class="slider-group">
        <label for="speedSlider">Speed:</label>
        <input type="range" id="speedSlider" min="1" max="10" value="3">
      </div>
    </div>
    <div class="status-text" id="statusText">System active. Total Energy conserved.</div>
  </div>
  <script>
    const canvas = document.getElementById("nbodyCanvas");
    const ctx = canvas.getContext("2d");
    const G = 1500;
    const eps = 12; // softening
    let bodies = [];

    function setupFigure8() {
      bodies = [];
      const m = 80;
      const x1 = -180, y1 = 0, vx1 = 0.466 * 1.5, vy1 = 0.432 * 1.5;
      const x2 = 180, y2 = 0, vx2 = 0.466 * 1.5, vy2 = 0.432 * 1.5;
      const x3 = 0, y3 = 0, vx3 = -2 * vx1, vy3 = -2 * vy1;
      bodies.push({ x: 380 + x1, y: 230 + y1, vx: vx1, vy: vy1, m: m, color: "#38bdf8", trail: [] });
      bodies.push({ x: 380 + x2, y: 230 + y2, vx: vx2, vy: vy2, m: m, color: "#f59e0b", trail: [] });
      bodies.push({ x: 380 + x3, y: 230 + y3, vx: vx3, vy: vy3, m: m, color: "#10b981", trail: [] });
    }

    function setupSolar() {
      bodies = [];
      const cx = 380, cy = 230;
      // Central massive sun
      bodies.push({ x: cx, y: cy, vx: 0, vy: 0, m: 800, color: "#fbbf24", r: 12, trail: [] });
      // Planets
      bodies.push({ x: cx + 90, y: cy, vx: 0, vy: -3.8, m: 5, color: "#38bdf8", r: 4, trail: [] });
      bodies.push({ x: cx + 160, y: cy, vx: 0, vy: -2.8, m: 12, color: "#10b981", r: 6, trail: [] });
      bodies.push({ x: cx + 240, y: cy, vx: 0, vy: -2.3, m: 18, color: "#ec4899", r: 7, trail: [] });
    }

    function setupChaos() {
      bodies = [];
      const cx = 380, cy = 230;
      bodies.push({ x: cx - 100, y: cy, vx: 0, vy: 1.8, m: 60, color: "#38bdf8", trail: [] });
      bodies.push({ x: cx + 100, y: cy, vx: 0, vy: -1.8, m: 60, color: "#f59e0b", trail: [] });
      bodies.push({ x: cx, y: cy - 100, vx: -1.8, vy: 0, m: 60, color: "#10b981", trail: [] });
      bodies.push({ x: cx, y: cy + 100, vx: 1.8, vy: 0, m: 60, color: "#a855f7", trail: [] });
    }

    setupSolar();

    document.getElementById("presetFigure8").onclick = setupFigure8;
    document.getElementById("presetSolar").onclick = setupSolar;
    document.getElementById("presetChaos").onclick = setupChaos;
    document.getElementById("clearTrails").onclick = () => bodies.forEach(b => b.trail = []);

    canvas.onclick = e => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      bodies.push({ x: x, y: y, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2, m: 10, color: "#f43f5e", r: 5, trail: [] });
    };

    function stepPhysics(dt) {
      const N = bodies.length;
      const ax = new Array(N).fill(0);
      const ay = new Array(N).fill(0);

      for (let i = 0; i < N; i++) {
        for (let j = i + 1; j < N; j++) {
          const dx = bodies[j].x - bodies[i].x;
          const dy = bodies[j].y - bodies[i].y;
          const dist2 = dx * dx + dy * dy + eps * eps;
          const dist = Math.sqrt(dist2);
          const f = (G * bodies[i].m * bodies[j].m) / (dist2 * dist);
          ax[i] += f * dx / bodies[i].m;
          ay[i] += f * dy / bodies[i].m;
          ax[j] -= f * dx / bodies[j].m;
          ay[j] -= f * dy / bodies[j].m;
        }
      }

      for (let i = 0; i < N; i++) {
        bodies[i].vx += ax[i] * dt;
        bodies[i].vy += ay[i] * dt;
        bodies[i].x += bodies[i].vx * dt;
        bodies[i].y += bodies[i].vy * dt;
        bodies[i].trail.push({ x: bodies[i].x, y: bodies[i].y });
        if (bodies[i].trail.length > 250) bodies[i].trail.shift();
      }
    }

    function loop() {
      const substeps = parseInt(document.getElementById("speedSlider").value);
      for (let s = 0; s < substeps; s++) stepPhysics(0.2);

      ctx.fillStyle = "rgba(2, 6, 23, 0.25)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      bodies.forEach(b => {
        // Draw trail
        if (b.trail.length > 1) {
          ctx.strokeStyle = b.color;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(b.trail[0].x, b.trail[0].y);
          for (let p of b.trail) ctx.lineTo(p.x, p.y);
          ctx.stroke();
        }
        // Draw body
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r || Math.max(3, Math.cbrt(b.m) * 1.8), 0, 2 * Math.PI);
        ctx.fill();
      });

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
