<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Principal Component Analysis (PCA) — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .header {
      text-align: center;
      max-width: 800px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 8px;
    }
    .desc {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .nav-bar {
      margin-top: 8px;
      margin-bottom: 16px;
    }
    .nav-bar a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid #1e293b;
      padding: 4px 12px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .nav-bar a:hover {
      background: #1e293b;
    }
    .sim-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 1000px;
      width: 100%;
    }
    canvas {
      background: #030712;
      border: 1px solid #374151;
      border-radius: 8px;
      cursor: crosshair;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-top: 16px;
      width: 100%;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button.secondary {
      background: #374151;
    }
    button.secondary:hover { background: #4b5563; }
    .param-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    input[type="range"] {
      accent-color: #3b82f6;
    }
    .metrics-panel {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      font-size: 0.9rem;
      color: #a7f3d0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #0f172a;
      padding: 10px 20px;
      border-radius: 6px;
      border: 1px solid #1e293b;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Principal Component Analysis (PCA)</h1>
    <p class="desc">Module C: Eigenvector variance decomposition on 2D Gaussian point clouds.</p>
    <div class="nav-bar"><a href="index.html">← Back to All Visualizers</a></div>
  </div>

  <div class="sim-card">
    <canvas id="simCanvas" width="650" height="420"></canvas>
    
    <div class="controls">
      
<button id="btnNewCloud">Random Gaussian Cloud</button>
<button id="btnTogglePC2">Toggle PC2</button>

    </div>

    <div class="metrics-panel" id="metricsPanel">
      <span>Status: Ready</span>
    </div>
  </div>

  <script>
    
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let points = [];
let showPC2 = true;
let meanX = 0, meanY = 0;
let ev1 = { x: 1, y: 0, val: 1 }, ev2 = { x: 0, y: 1, val: 1 };

function generateData() {
  points = [];
  let theta = Math.PI / 6;
  let cosT = Math.cos(theta), sinT = Math.sin(theta);
  let cx = W/2, cy = H/2;

  for (let i = 0; i < 100; i++) {
    let u = (Math.random() - 0.5) * 280;
    let v = (Math.random() - 0.5) * 70;
    let x = cx + u * cosT - v * sinT;
    let y = cy + u * sinT + v * cosT;
    points.push({ x, y });
  }
  computePCA();
  draw();
}

function computePCA() {
  let N = points.length;
  meanX = points.reduce((s, p) => s + p.x, 0) / N;
  meanY = points.reduce((s, p) => s + p.y, 0) / N;

  let cxx = 0, cyy = 0, cxy = 0;
  for (let p of points) {
    let dx = p.x - meanX, dy = p.y - meanY;
    cxx += dx * dx;
    cyy += dy * dy;
    cxy += dx * dy;
  }
  cxx /= N; cyy /= N; cxy /= N;

  // 2x2 eigenvalue decomposition
  let trace = cxx + cyy;
  let det = cxx * cyy - cxy * cxy;
  let term = Math.sqrt(Math.max(0, trace * trace / 4 - det));
  let l1 = trace / 2 + term;
  let l2 = trace / 2 - term;

  let v1x = cxy, v1y = l1 - cxx;
  let len1 = Math.hypot(v1x, v1y) || 1;
  ev1 = { x: v1x / len1, y: v1y / len1, val: l1 };

  let v2x = -ev1.y, v2y = ev1.x;
  ev2 = { x: v2x, y: v2y, val: l2 };

  let explained1 = (l1 / (l1 + l2)) * 100;
  document.getElementById('metricsPanel').innerHTML = 
    `<span>PC1 Variance: ${explained1.toFixed(1)}%</span><span>PC2 Variance: ${(100 - explained1).toFixed(1)}%</span>`;
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Draw points
  ctx.fillStyle = '#60a5fa';
  for (let p of points) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw PC1 vector
  let len1 = Math.sqrt(ev1.val) * 1.5;
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(meanX - ev1.x * len1, meanY - ev1.y * len1);
  ctx.lineTo(meanX + ev1.x * len1, meanY + ev1.y * len1);
  ctx.stroke();

  // Draw PC2 vector
  if (showPC2) {
    let len2 = Math.sqrt(ev2.val) * 1.5;
    ctx.strokeStyle = '#10b981';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(meanX - ev2.x * len2, meanY - ev2.y * len2);
    ctx.lineTo(meanX + ev2.x * len2, meanY + ev2.y * len2);
    ctx.stroke();
  }

  // Center
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(meanX, meanY, 5, 0, Math.PI * 2); ctx.fill();
}

document.getElementById('btnNewCloud').onclick = generateData;
document.getElementById('btnTogglePC2').onclick = () => { showPC2 = !showPC2; draw(); };

generateData();

  </script>
</body>
</html>
