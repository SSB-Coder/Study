<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Gram-Schmidt Orthogonalization — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }
    .header { text-align: center; max-width: 820px; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: #a855f7; margin-bottom: 8px; }
    .desc { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .nav-bar { margin-top: 8px; margin-bottom: 16px; }
    .nav-bar a { color: #38bdf8; text-decoration: none; font-size: 0.85rem; border: 1px solid #1e293b; padding: 4px 12px; border-radius: 4px; }
    .sim-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; max-width: 860px; width: 100%; }
    canvas { background: #030712; border: 1px solid #374151; border-radius: 8px; margin-bottom: 16px; cursor: pointer; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; background: #1f2937; padding: 12px 18px; border-radius: 8px; width: 100%; }
    button { background: #9333ea; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #7e22ce; }
    .status-text { margin-top: 12px; font-family: monospace; font-size: 0.95rem; color: #c084fc; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Module V01: Modified Gram-Schmidt QR Factorization</h1>
    <p class="desc">Interactive 2D vector space orthogonalization. Drag vector endpoints $a_1$ and $a_2$ to watch projection subtraction and orthonormal basis $Q = [q_1, q_2]$ generation in real time!</p>
    <div class="nav-bar"><a href="index.html">&larr; Return to Simulation Hub</a></div>
  </div>
  <div class="sim-card">
    <canvas id="qrCanvas" width="760" height="420"></canvas>
    <div class="controls">
      <button id="btnRandom">Randomize Basis Vectors</button>
      <button id="btnNearCollinear">Test Near-Collinear Instability</button>
    </div>
    <div class="status-text" id="statusText">Orthogonalizing...</div>
  </div>
  <script>
    const canvas = document.getElementById("qrCanvas");
    const ctx = canvas.getContext("2d");
    const origX = canvas.width / 2, origY = canvas.height / 2;

    let a1 = { x: 140, y: -80 };
    let a2 = { x: 110, y: -160 };
    let dragTarget = null;

    canvas.onmousedown = e => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left - origX;
      const my = e.clientY - rect.top - origY;
      if (Math.hypot(mx - a1.x, my - a1.y) < 20) dragTarget = a1;
      else if (Math.hypot(mx - a2.x, my - a2.y) < 20) dragTarget = a2;
    };
    window.onmouseup = () => dragTarget = null;
    canvas.onmousemove = e => {
      if (!dragTarget) return;
      const rect = canvas.getBoundingClientRect();
      dragTarget.x = e.clientX - rect.left - origX;
      dragTarget.y = e.clientY - rect.top - origY;
      draw();
    };

    document.getElementById("btnRandom").onclick = () => {
      a1 = { x: (Math.random() - 0.5) * 300, y: (Math.random() - 0.5) * 300 };
      a2 = { x: (Math.random() - 0.5) * 300, y: (Math.random() - 0.5) * 300 };
      draw();
    };
    document.getElementById("btnNearCollinear").onclick = () => {
      a1 = { x: 180, y: -100 };
      a2 = { x: 185, y: -103 };
      draw();
    };

    function drawArrow(fromX, fromY, toX, toY, color, width = 2) {
      const headlen = 10;
      const dx = toX - fromX, dy = toY - fromY;
      const angle = Math.atan2(dy, dx);
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width;
      ctx.beginPath(); ctx.moveTo(fromX, fromY); ctx.lineTo(toX, toY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(toX, toY);
      ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
      ctx.closePath(); ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, origY); ctx.lineTo(canvas.width, origY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(origX, 0); ctx.lineTo(origX, canvas.height); ctx.stroke();

      // Modified Gram-Schmidt
      // q1 = a1 / ||a1||
      const normA1 = Math.hypot(a1.x, a1.y);
      const q1 = { x: a1.x / normA1, y: a1.y / normA1 };

      // proj_{q1}(a2) = (a2 . q1) q1
      const dot = a2.x * q1.x + a2.y * q1.y;
      const proj = { x: dot * q1.x, y: dot * q1.y };

      // v2 = a2 - proj
      const v2 = { x: a2.x - proj.x, y: a2.y - proj.y };
      const normV2 = Math.hypot(v2.x, v2.y);
      const q2 = { x: v2.x / normV2, y: v2.y / normV2 };

      // Draw input vectors a1, a2 (Cyan and Orange)
      drawArrow(origX, origY, origX + a1.x, origY + a1.y, "#38bdf8", 3);
      drawArrow(origX, origY, origX + a2.x, origY + a2.y, "#f59e0b", 3);

      // Draw projection dashed line
      ctx.strokeStyle = "rgba(234, 179, 8, 0.4)"; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(origX + a2.x, origY + a2.y); ctx.lineTo(origX + proj.x, origY + proj.y); ctx.stroke();
      ctx.setLineDash([]);

      // Draw Orthonormal basis Q (q1, q2 scaled for visibility)
      const scaleQ = 90;
      drawArrow(origX, origY, origX + q1.x * scaleQ, origY + q1.y * scaleQ, "#10b981", 3.5);
      drawArrow(origX, origY, origX + q2.x * scaleQ, origY + q2.y * scaleQ, "#ec4899", 3.5);

      // Dot product <q1, q2>
      const orthDot = (q1.x * q2.x + q1.y * q2.y);
      document.getElementById("statusText").innerHTML =
        `R11 = ${normA1.toFixed(1)}, R12 = ${dot.toFixed(1)}, R22 = ${normV2.toFixed(1)} &nbsp;|&nbsp; <strong>&lang;q1, q2&rang; = ${orthDot.toExponential(3)} (Orthogonal)</strong>`;
    }
    draw();
  </script>
</body>
</html>
