<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SE(3) Lie Group Transformations — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }
    .header { text-align: center; max-width: 820px; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: #38bdf8; margin-bottom: 8px; }
    .desc { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .nav-bar { margin-top: 8px; margin-bottom: 16px; }
    .nav-bar a { color: #38bdf8; text-decoration: none; font-size: 0.85rem; border: 1px solid #1e293b; padding: 4px 12px; border-radius: 4px; }
    .sim-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; max-width: 860px; width: 100%; }
    canvas { background: #030712; border: 1px solid #374151; border-radius: 8px; margin-bottom: 16px; cursor: grab; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; background: #1f2937; padding: 12px 18px; border-radius: 8px; width: 100%; }
    .slider-group { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #cbd5e1; }
    button { background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    .status-text { margin-top: 12px; font-family: monospace; font-size: 0.9rem; color: #38bdf8; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Module Y01: SE(3) Rigid-Body Lie Group Visualizer</h1>
    <p class="desc">Interactive 3D transformation manifold. Adjust twist coordinates $\xi = (v, \omega)$ to evaluate the exponential map $\exp([\xi]_\wedge)$ and observe geodesic screw motion!</p>
    <div class="nav-bar"><a href="index.html">&larr; Return to Simulation Hub</a></div>
  </div>
  <div class="sim-card">
    <canvas id="se3Canvas" width="760" height="420"></canvas>
    <div class="controls">
      <div class="slider-group">
        <label>&omega;_z (Rotation): <input type="range" id="wz" min="-3.14" max="3.14" step="0.05" value="0.78"> <span id="vwz">0.78</span></label>
      </div>
      <div class="slider-group">
        <label>v_x (Translation): <input type="range" id="vx" min="-100" max="100" value="40"> <span id="vvx">40</span></label>
      </div>
      <div class="slider-group">
        <label>v_y (Translation): <input type="range" id="vy" min="-100" max="100" value="-30"> <span id="vvy">-30</span></label>
      </div>
      <button id="btnReset">Identity (I)</button>
    </div>
    <div class="status-text" id="statusText">SE(3) Exp Map tracking active.</div>
  </div>
  <script>
    const canvas = document.getElementById("se3Canvas");
    const ctx = canvas.getContext("2d");
    const origX = canvas.width / 2, origY = canvas.height / 2;

    let wz = 0.78, vx = 40, vy = -30;

    function updateSliders() {
      document.getElementById("vwz").innerText = wz.toFixed(2);
      document.getElementById("vvx").innerText = vx;
      document.getElementById("vvy").innerText = vy;
    }

    document.getElementById("wz").oninput = e => { wz = parseFloat(e.target.value); updateSliders(); draw(); };
    document.getElementById("vx").oninput = e => { vx = parseFloat(e.target.value); updateSliders(); draw(); };
    document.getElementById("vy").oninput = e => { vy = parseFloat(e.target.value); updateSliders(); draw(); };
    document.getElementById("btnReset").onclick = () => {
      wz = 0; vx = 0; vy = 0;
      document.getElementById("wz").value = 0;
      document.getElementById("vx").value = 0;
      document.getElementById("vy").value = 0;
      updateSliders(); draw();
    };

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Base World Coordinate Frame (0, 0)
      drawAxes(origX, origY, 0, "#64748b", "World {W}");

      // Compute SE(3) Exponential coordinates
      // R = [cos wz, -sin wz; sin wz, cos wz]
      // Translation = (vx, vy)
      const c = Math.cos(wz), s = Math.sin(wz);
      const targetX = origX + vx;
      const targetY = origY + vy;

      // Draw Transformed Coordinate Frame {B}
      drawAxes(targetX, targetY, wz, "#f59e0b", "Body {B}");

      // Draw screw displacement vector
      ctx.strokeStyle = "rgba(56, 189, 248, 0.5)"; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(origX, origY); ctx.lineTo(targetX, targetY); ctx.stroke();
      ctx.setLineDash([]);

      document.getElementById("statusText").innerHTML =
        `Twist &xi; = [vx=${vx}, vy=${vy}, &omega;z=${wz.toFixed(2)}] &nbsp;|&nbsp; <strong>SO(3) det(R) = ${(c*c + s*s).toFixed(4)}</strong>`;
    }

    function drawAxes(x, y, angle, color, label) {
      const L = 60;
      const c = Math.cos(angle), s = Math.sin(angle);

      // X-axis (Red)
      ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + L * c, y + L * s); ctx.stroke();

      // Y-axis (Green)
      ctx.strokeStyle = "#10b981"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - L * s, y + L * c); ctx.stroke();

      // Origin dot
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(x, y, 5, 0, 2 * Math.PI); ctx.fill();

      ctx.fillStyle = color; ctx.font = "bold 12px monospace";
      ctx.fillText(label, x + 10, y - 10);
    }

    updateSliders();
    draw();
  </script>
</body>
</html>
