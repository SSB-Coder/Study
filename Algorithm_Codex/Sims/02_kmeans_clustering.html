<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>k-Means Clustering & Voronoi Cells — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .header {
      text-align: center;
      max-width: 800px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 8px;
    }
    .desc {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .nav-bar {
      margin-top: 8px;
      margin-bottom: 16px;
    }
    .nav-bar a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid #1e293b;
      padding: 4px 12px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .nav-bar a:hover {
      background: #1e293b;
    }
    .sim-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 1000px;
      width: 100%;
    }
    canvas {
      background: #030712;
      border: 1px solid #374151;
      border-radius: 8px;
      cursor: crosshair;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-top: 16px;
      width: 100%;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button.secondary {
      background: #374151;
    }
    button.secondary:hover { background: #4b5563; }
    .param-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    input[type="range"] {
      accent-color: #3b82f6;
    }
    .metrics-panel {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      font-size: 0.9rem;
      color: #a7f3d0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #0f172a;
      padding: 10px 20px;
      border-radius: 6px;
      border: 1px solid #1e293b;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>k-Means Clustering & Voronoi Cells</h1>
    <p class="desc">Module C: Step-by-step centroid updates and cluster reassignment on 2D data points.</p>
    <div class="nav-bar"><a href="index.html">← Back to All Visualizers</a></div>
  </div>

  <div class="sim-card">
    <canvas id="simCanvas" width="650" height="420"></canvas>
    
    <div class="controls">
      
<button id="btnStep">Step k-Means</button>
<button id="btnNewData">Random Points</button>
<button id="btnReset" class="secondary">Reset Centroids</button>
<div class="param-group">
  <label>Clusters (k):</label>
  <input type="range" id="sliderK" min="2" max="6" step="1" value="3">
  <span id="lblK">3</span>
</div>

    </div>

    <div class="metrics-panel" id="metricsPanel">
      <span>Status: Ready</span>
    </div>
  </div>

  <script>
    
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let points = [];
let centroids = [];
let k = 3;
const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];

function initData() {
  points = [];
  for (let c = 0; c < k; c++) {
    let cx = 100 + Math.random() * (W - 200);
    let cy = 100 + Math.random() * (H - 200);
    for (let i = 0; i < 25; i++) {
      points.push({
        x: cx + (Math.random() - 0.5) * 120,
        y: cy + (Math.random() - 0.5) * 120,
        cluster: -1
      });
    }
  }
  initCentroids();
}

function initCentroids() {
  centroids = [];
  for (let i = 0; i < k; i++) {
    centroids.push({
      x: 50 + Math.random() * (W - 100),
      y: 50 + Math.random() * (H - 100)
    });
  }
  assignClusters();
  draw();
}

function assignClusters() {
  for (let p of points) {
    let minDist = Infinity;
    let bestC = 0;
    for (let c = 0; c < k; c++) {
      let d = (p.x - centroids[c].x)**2 + (p.y - centroids[c].y)**2;
      if (d < minDist) {
        minDist = d;
        bestC = c;
      }
    }
    p.cluster = bestC;
  }
}

function step() {
  assignClusters();
  // Update centroids
  let counts = new Array(k).fill(0);
  let sums = Array.from({length: k}, () => ({x: 0, y: 0}));

  for (let p of points) {
    counts[p.cluster]++;
    sums[p.cluster].x += p.x;
    sums[p.cluster].y += p.y;
  }

  let shift = 0;
  for (let c = 0; c < k; c++) {
    if (counts[c] > 0) {
      let nx = sums[c].x / counts[c];
      let ny = sums[c].y / counts[c];
      shift += Math.hypot(nx - centroids[c].x, ny - centroids[c].y);
      centroids[c].x = nx;
      centroids[c].y = ny;
    }
  }

  document.getElementById('metricsPanel').innerHTML = 
    `<span>Centroid Shift: ${shift.toFixed(2)}px</span><span>Status: ${shift < 1 ? "Converged!" : "Iterating"}</span>`;
  draw();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Draw points
  for (let p of points) {
    ctx.fillStyle = p.cluster >= 0 ? colors[p.cluster] : '#94a3b8';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw centroids
  for (let c = 0; c < k; c++) {
    ctx.fillStyle = colors[c];
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(centroids[c].x, centroids[c].y, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Cross
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(centroids[c].x - 6, centroids[c].y); ctx.lineTo(centroids[c].x + 6, centroids[c].y);
    ctx.moveTo(centroids[c].x, centroids[c].y - 6); ctx.lineTo(centroids[c].x, centroids[c].y + 6);
    ctx.stroke();
  }
}

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  points.push({ x: e.clientX - rect.left, y: e.clientY - rect.top, cluster: -1 });
  assignClusters();
  draw();
});

document.getElementById('btnStep').onclick = step;
document.getElementById('btnNewData').onclick = initData;
document.getElementById('btnReset').onclick = initCentroids;
document.getElementById('sliderK').oninput = (e) => {
  k = parseInt(e.target.value);
  document.getElementById('lblK').innerText = k;
  initData();
};

initData();

  </script>
</body>
</html>
