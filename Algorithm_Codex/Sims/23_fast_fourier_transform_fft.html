<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fast Fourier Transform (FFT) — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }
    .header { text-align: center; max-width: 820px; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: #38bdf8; margin-bottom: 8px; }
    .desc { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .nav-bar { margin-top: 8px; margin-bottom: 16px; }
    .nav-bar a { color: #38bdf8; text-decoration: none; font-size: 0.85rem; border: 1px solid #1e293b; padding: 4px 12px; border-radius: 4px; }
    .sim-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; max-width: 860px; width: 100%; }
    canvas { background: #030712; border: 1px solid #374151; border-radius: 8px; margin-bottom: 16px; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; background: #1f2937; padding: 12px 18px; border-radius: 8px; width: 100%; }
    .slider-group { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #cbd5e1; }
    .status-text { margin-top: 12px; font-family: monospace; font-size: 0.9rem; color: #38bdf8; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Module U01: Fast Fourier Transform (FFT) Live Spectrum</h1>
    <p class="desc">Cooley-Tukey Radix-2 FFT decomposition. Synthesize multi-tone harmonic frequencies and observe instantaneous frequency domain peaks!</p>
    <div class="nav-bar"><a href="index.html">&larr; Return to Simulation Hub</a></div>
  </div>
  <div class="sim-card">
    <canvas id="fftCanvas" width="760" height="420"></canvas>
    <div class="controls">
      <div class="slider-group">
        <label>Freq 1: <input type="range" id="f1" min="1" max="30" value="5"> <span id="v1">5 Hz</span></label>
      </div>
      <div class="slider-group">
        <label>Freq 2: <input type="range" id="f2" min="1" max="50" value="12"> <span id="v2">12 Hz</span></label>
      </div>
      <div class="slider-group">
        <label>Freq 3: <input type="range" id="f3" min="1" max="80" value="28"> <span id="v3">28 Hz</span></label>
      </div>
      <div class="slider-group">
        <label>Noise: <input type="range" id="noise" min="0" max="50" value="10"> <span id="vn">0.1</span></label>
      </div>
    </div>
    <div class="status-text" id="statusText">FFT ready.</div>
  </div>
  <script>
    const canvas = document.getElementById("fftCanvas");
    const ctx = canvas.getContext("2d");
    const N = 256; // Power of 2
    const Fs = 128; // Sampling rate

    function fft(re, im) {
      const n = re.length;
      if (n <= 1) return;
      // Bit reversal
      let j = 0;
      for (let i = 0; i < n - 1; i++) {
        if (i < j) {
          let tr = re[i]; re[i] = re[j]; re[j] = tr;
          let ti = im[i]; im[i] = im[j]; im[j] = ti;
        }
        let k = n >> 1;
        while (k <= j) { j -= k; k >>= 1; }
        j += k;
      }
      // Cooley-Tukey butterflies
      for (let len = 2; len <= n; len <<= 1) {
        let ang = -2 * Math.PI / len;
        let wlen_r = Math.cos(ang), wlen_i = Math.sin(ang);
        for (let i = 0; i < n; i += len) {
          let wr = 1, wi = 0;
          for (let k = 0; k < len / 2; k++) {
            let u_r = re[i + k], u_i = im[i + k];
            let v_r = re[i + k + len / 2] * wr - im[i + k + len / 2] * wi;
            let v_i = re[i + k + len / 2] * wi + im[i + k + len / 2] * wr;
            re[i + k] = u_r + v_r; im[i + k] = u_i + v_i;
            re[i + k + len / 2] = u_r - v_r; im[i + k + len / 2] = u_i - v_i;
            let nwr = wr * wlen_r - wi * wlen_i;
            wi = wr * wlen_i + wi * wlen_r; wr = nwr;
          }
        }
      }
    }

    function draw() {
      const f1 = parseFloat(document.getElementById("f1").value);
      const f2 = parseFloat(document.getElementById("f2").value);
      const f3 = parseFloat(document.getElementById("f3").value);
      const noise = parseFloat(document.getElementById("noise").value) / 50;

      document.getElementById("v1").innerText = `${f1} Hz`;
      document.getElementById("v2").innerText = `${f2} Hz`;
      document.getElementById("v3").innerText = `${f3} Hz`;
      document.getElementById("vn").innerText = noise.toFixed(2);

      const signal = new Float64Array(N);
      const im = new Float64Array(N);

      for (let i = 0; i < N; i++) {
        const t = i / Fs;
        signal[i] = Math.sin(2 * Math.PI * f1 * t) + 0.7 * Math.sin(2 * Math.PI * f2 * t) + 0.5 * Math.sin(2 * Math.PI * f3 * t) + (Math.random() - 0.5) * noise * 2;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Time domain waveform (Top half)
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      const topH = 180, midY = 100;
      for (let i = 0; i < N; i++) {
        const x = 50 + (i / N) * (canvas.width - 100);
        const y = midY - signal[i] * 32;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();

      ctx.fillStyle = "#94a3b8"; ctx.font = "12px monospace";
      ctx.fillText("Time Domain Waveform x(t)", 50, 30);

      // Run FFT
      const re = signal.slice();
      fft(re, im);

      // 2. Frequency domain magnitude spectrum (Bottom half)
      const specY = 380;
      ctx.strokeStyle = "#475569";
      ctx.beginPath(); ctx.moveTo(50, specY); ctx.lineTo(canvas.width - 50, specY); ctx.stroke();

      ctx.fillStyle = "#f59e0b";
      ctx.fillText("Frequency Spectrum |X(f)| (0 to 64 Hz)", 50, 230);

      const half = N / 2;
      const barW = (canvas.width - 100) / half;

      for (let i = 0; i < half; i++) {
        const mag = Math.sqrt(re[i] * re[i] + im[i] * im[i]) / (N / 2);
        const freq = (i * Fs) / N;
        const x = 50 + i * barW;
        const h = Math.min(130, mag * 110);

        ctx.fillStyle = (Math.abs(freq - f1) < 0.6 || Math.abs(freq - f2) < 0.6 || Math.abs(freq - f3) < 0.6) ? "#34d399" : "#f59e0b";
        ctx.fillRect(x, specY - h, barW - 1, h);
      }

      document.getElementById("statusText").innerHTML =
        `Dominant Peaks Detected: <strong>${f1} Hz, ${f2} Hz, ${f3} Hz</strong>`;
    }

    ["f1", "f2", "f3", "noise"].forEach(id => document.getElementById(id).oninput = draw);
    draw();
  </script>
</body>
</html>
