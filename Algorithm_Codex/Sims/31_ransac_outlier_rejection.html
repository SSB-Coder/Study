<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RANSAC Line Fitting — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }
    .header { text-align: center; max-width: 820px; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: #10b981; margin-bottom: 8px; }
    .desc { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .nav-bar { margin-top: 8px; margin-bottom: 16px; }
    .nav-bar a { color: #38bdf8; text-decoration: none; font-size: 0.85rem; border: 1px solid #1e293b; padding: 4px 12px; border-radius: 4px; }
    .sim-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; max-width: 860px; width: 100%; }
    canvas { background: #030712; border: 1px solid #374151; border-radius: 8px; margin-bottom: 16px; cursor: pointer; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; background: #1f2937; padding: 12px 18px; border-radius: 8px; width: 100%; }
    button { background: #059669; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #047857; }
    .status-text { margin-top: 12px; font-family: monospace; font-size: 0.95rem; color: #34d399; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Module X09: RANSAC Robust Regression Lab</h1>
    <p class="desc">Random Sample Consensus vs Ordinary Least Squares (OLS) under extreme outlier noise. Click canvas to add custom outlier data points!</p>
    <div class="nav-bar"><a href="index.html">&larr; Return to Simulation Hub</a></div>
  </div>
  <div class="sim-card">
    <canvas id="ransacCanvas" width="760" height="420"></canvas>
    <div class="controls">
      <button id="btnStep">Step RANSAC Iteration</button>
      <button id="btnSolve">Run 40 Iterations</button>
      <button id="btnNewNoise">Regenerate Data (40% Outliers)</button>
    </div>
    <div class="status-text" id="statusText">RANSAC Ready.</div>
  </div>
  <script>
    const canvas = document.getElementById("ransacCanvas");
    const ctx = canvas.getContext("2d");

    let points = [];
    let bestModel = null;
    let currentSample = null;
    let iterationsDone = 0;
    const threshold = 18; // Inlier distance

    function generatePoints() {
      points = [];
      const nInliers = 50, nOutliers = 35;
      const m = -0.5, c = 260;

      // Inliers with small Gaussian noise
      for (let i = 0; i < nInliers; i++) {
        const x = 60 + Math.random() * (canvas.width - 120);
        const y = m * x + c + (Math.random() - 0.5) * 20;
        points.push({ x, y });
      }

      // Outliers uniformly distributed across screen
      for (let i = 0; i < nOutliers; i++) {
        points.push({ x: 50 + Math.random() * (canvas.width - 100), y: 40 + Math.random() * (canvas.height - 80) });
      }
      bestModel = null; currentSample = null; iterationsDone = 0;
      draw();
    }
    generatePoints();

    canvas.onclick = e => {
      const rect = canvas.getBoundingClientRect();
      points.push({ x: e.clientX - rect.left, y: e.clientY - rect.top });
      draw();
    };

    function stepRansac() {
      if (points.length < 2) return;
      const i1 = Math.floor(Math.random() * points.length);
      let i2 = Math.floor(Math.random() * points.length);
      while (i2 === i1) i2 = Math.floor(Math.random() * points.length);

      const p1 = points[i1], p2 = points[i2];
      currentSample = [p1, p2];
      iterationsDone++;

      // Line: a*x + b*y + c = 0
      const a = p2.y - p1.y;
      const b = p1.x - p2.x;
      const c = p2.x * p1.y - p1.x * p2.y;
      const denom = Math.hypot(a, b);

      let inliers = 0;
      for (let p of points) {
        const dist = Math.abs(a * p.x + b * p.y + c) / denom;
        if (dist <= threshold) inliers++;
      }

      if (!bestModel || inliers > bestModel.inliers) {
        bestModel = { a, b, c, inliers };
      }
      draw();
    }

    document.getElementById("btnStep").onclick = stepRansac;
    document.getElementById("btnSolve").onclick = () => { for (let i = 0; i < 40; i++) stepRansac(); };
    document.getElementById("btnNewNoise").onclick = generatePoints;

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Ordinary Least Squares (OLS) line (Red)
      let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
      for (let p of points) {
        sumX += p.x; sumY += p.y; sumXY += p.x * p.y; sumX2 += p.x * p.x;
      }
      const N = points.length;
      const m_ols = (N * sumXY - sumX * sumY) / (N * sumX2 - sumX * sumX);
      const c_ols = (sumY - m_ols * sumX) / N;

      ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
      ctx.beginPath(); ctx.moveTo(0, c_ols); ctx.lineTo(canvas.width, m_ols * canvas.width + c_ols); ctx.stroke();
      ctx.setLineDash([]);

      // 2. RANSAC Line (Green)
      if (bestModel) {
        const { a, b, c } = bestModel;
        ctx.strokeStyle = "#10b981"; ctx.lineWidth = 3.5;
        const y0 = (-c - a * 0) / b;
        const y1 = (-c - a * canvas.width) / b;
        ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(canvas.width, y1); ctx.stroke();
      }

      // Draw points
      points.forEach(p => {
        let isInlier = false;
        if (bestModel) {
          const dist = Math.abs(bestModel.a * p.x + bestModel.b * p.y + bestModel.c) / Math.hypot(bestModel.a, bestModel.b);
          isInlier = dist <= threshold;
        }
        ctx.fillStyle = isInlier ? "#10b981" : "#94a3b8";
        ctx.beginPath(); ctx.arc(p.x, p.y, isInlier ? 5 : 3.5, 0, 2 * Math.PI); ctx.fill();
      });

      document.getElementById("statusText").innerHTML =
        `Iterations: ${iterationsDone} &nbsp;|&nbsp; RANSAC Inliers: <strong>${bestModel ? bestModel.inliers : 0} / ${points.length}</strong> &nbsp;|&nbsp; <span style="color:#ef4444">OLS corrupted by outliers</span> vs <span style="color:#10b981">RANSAC robust fit</span>`;
    }
  </script>
</body>
</html>
