<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grover Amplitude Amplification — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }
    .header { text-align: center; max-width: 820px; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: #a855f7; margin-bottom: 8px; }
    .desc { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .nav-bar { margin-top: 8px; margin-bottom: 16px; }
    .nav-bar a { color: #38bdf8; text-decoration: none; font-size: 0.85rem; border: 1px solid #1e293b; padding: 4px 12px; border-radius: 4px; }
    .sim-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; max-width: 860px; width: 100%; }
    canvas { background: #030712; border: 1px solid #374151; border-radius: 8px; margin-bottom: 16px; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; background: #1f2937; padding: 12px 18px; border-radius: 8px; width: 100%; }
    button { background: #9333ea; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #7e22ce; }
    select { background: #111827; color: white; border: 1px solid #4b5563; padding: 6px 10px; border-radius: 6px; }
    .status-text { margin-top: 12px; font-family: monospace; font-size: 0.95rem; color: #c084fc; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Module R05: Grover Amplitude Amplification Live Lab</h1>
    <p class="desc">Interactive step-by-step quantum search across $N=8$ basis states ($n=3$ qubits). Alternate between Oracle Phase Inversion $O_w$ and Inversion About the Mean (Diffusion $D$).</p>
    <div class="nav-bar"><a href="index.html">&larr; Return to Simulation Hub</a></div>
  </div>
  <div class="sim-card">
    <canvas id="groverCanvas" width="760" height="400"></canvas>
    <div class="controls">
      <label for="targetSelect">Marked State (|w&rang;):</label>
      <select id="targetSelect">
        <option value="0">|000&rang;</option>
        <option value="1">|001&rang;</option>
        <option value="2">|010&rang;</option>
        <option value="3">|011&rang;</option>
        <option value="4">|100&rang;</option>
        <option value="5" selected>|101&rang;</option>
        <option value="6">|110&rang;</option>
        <option value="7">|111&rang;</option>
      </select>
      <button id="stepOracle">1. Apply Oracle (O)</button>
      <button id="stepDiffusion">2. Apply Diffusion (D)</button>
      <button id="runFull">Run 2 Full Iterations</button>
      <button id="resetGrover">Reset Uniform State</button>
    </div>
    <div class="status-text" id="statusText">State initialized to uniform superposition.</div>
  </div>
  <script>
    const canvas = document.getElementById("groverCanvas");
    const ctx = canvas.getContext("2d");
    const N = 8;
    let target = 5;
    let amplitudes = new Array(N).fill(1 / Math.sqrt(N));
    let stepCount = 0;
    let lastAction = "Initialized Uniform Superposition";

    function reset() {
      amplitudes = new Array(N).fill(1 / Math.sqrt(N));
      stepCount = 0;
      lastAction = "Initialized Uniform Superposition |s⟩";
      draw();
    }

    function oracle() {
      amplitudes[target] *= -1;
      stepCount += 0.5;
      lastAction = `Applied Oracle O: Inverted phase of marked state |${target.toString(2).padStart(3, '0')}⟩`;
      draw();
    }

    function diffusion() {
      const mean = amplitudes.reduce((a, b) => a + b, 0) / N;
      for (let i = 0; i < N; i++) amplitudes[i] = 2 * mean - amplitudes[i];
      stepCount += 0.5;
      lastAction = `Applied Diffusion D: Inverted all amplitudes about mean (${mean.toFixed(3)})`;
      draw();
    }

    document.getElementById("stepOracle").addEventListener("click", oracle);
    document.getElementById("stepDiffusion").addEventListener("click", diffusion);
    document.getElementById("resetGrover").addEventListener("click", reset);
    document.getElementById("targetSelect").addEventListener("change", e => { target = parseInt(e.target.value); reset(); });
    document.getElementById("runFull").addEventListener("click", () => {
      reset();
      oracle(); diffusion();
      oracle(); diffusion();
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const mean = amplitudes.reduce((a, b) => a + b, 0) / N;
      const zeroY = 240;
      const barW = 54;
      const gap = 38;
      const startX = 60;
      const scale = 160; // 1.0 amplitude = 160 px

      // Draw zero axis line
      ctx.strokeStyle = "#475569";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(startX - 20, zeroY); ctx.lineTo(canvas.width - 40, zeroY); ctx.stroke();

      // Draw dashed mean line
      const meanY = zeroY - mean * scale;
      ctx.strokeStyle = "#eab308";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 5]);
      ctx.beginPath(); ctx.moveTo(startX - 20, meanY); ctx.lineTo(canvas.width - 40, meanY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#eab308";
      ctx.font = "11px monospace";
      ctx.fillText(`Mean = ${mean.toFixed(3)}`, canvas.width - 130, meanY - 6);

      // Draw bars for each state
      for (let i = 0; i < N; i++) {
        const x = startX + i * (barW + gap);
        const amp = amplitudes[i];
        const h = amp * scale;
        const isTarget = (i === target);

        ctx.fillStyle = isTarget ? (amp >= 0 ? "#a855f7" : "#ef4444") : (amp >= 0 ? "#0284c7" : "#dc2626");
        if (h >= 0) {
          ctx.fillRect(x, zeroY - h, barW, h);
        } else {
          ctx.fillRect(x, zeroY, barW, -h);
        }

        // Probability text & state label
        const prob = (amp * amp).toFixed(3);
        ctx.fillStyle = isTarget ? "#c084fc" : "#94a3b8";
        ctx.font = "bold 12px monospace";
        ctx.textAlign = "center";
        ctx.fillText(`|${i.toString(2).padStart(3, '0')}⟩`, x + barW / 2, zeroY + 20);
        ctx.font = "11px monospace";
        ctx.fillText(`P=${prob}`, x + barW / 2, zeroY + 36);
        ctx.fillText(`a=${amp.toFixed(2)}`, x + barW / 2, amp >= 0 ? zeroY - h - 6 : zeroY - h + 14);
      }

      ctx.textAlign = "left";
      const targetProb = (amplitudes[target] * amplitudes[target]).toFixed(4);
      document.getElementById("statusText").innerHTML =
        `${lastAction} &nbsp;|&nbsp; Iterations: ${Math.floor(stepCount)} &nbsp;|&nbsp; <strong>P(Target) = ${(targetProb * 100).toFixed(1)}%</strong>`;
    }

    draw();
  </script>
</body>
</html>
