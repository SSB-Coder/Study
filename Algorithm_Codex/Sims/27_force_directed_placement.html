<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Force-Directed Placement — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }
    .header { text-align: center; max-width: 820px; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: #f59e0b; margin-bottom: 8px; }
    .desc { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .nav-bar { margin-top: 8px; margin-bottom: 16px; }
    .nav-bar a { color: #38bdf8; text-decoration: none; font-size: 0.85rem; border: 1px solid #1e293b; padding: 4px 12px; border-radius: 4px; }
    .sim-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; max-width: 860px; width: 100%; }
    canvas { background: #030712; border: 1px solid #374151; border-radius: 8px; margin-bottom: 16px; cursor: grab; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; background: #1f2937; padding: 12px 18px; border-radius: 8px; width: 100%; }
    button { background: #d97706; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #b45309; }
    .status-text { margin-top: 12px; font-family: monospace; font-size: 0.9rem; color: #fbbf24; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Module W03: Force-Directed VLSI Placement & Graph Layout</h1>
    <p class="desc">Fruchterman-Reingold spring-electrical simulation. Drag nodes to disrupt the circuit netlist and watch spontaneous self-organization!</p>
    <div class="nav-bar"><a href="index.html">&larr; Return to Simulation Hub</a></div>
  </div>
  <div class="sim-card">
    <canvas id="fdCanvas" width="760" height="440"></canvas>
    <div class="controls">
      <button id="btnShake">Disrupt Layout</button>
      <button id="btnAddNode">Add Logic Node</button>
    </div>
    <div class="status-text" id="statusText">System relaxing into minimum wire-length equilibrium...</div>
  </div>
  <script>
    const canvas = document.getElementById("fdCanvas");
    const ctx = canvas.getContext("2d");
    let nodes = [];
    let edges = [];
    let draggedNode = null;

    function initGraph() {
      nodes = []; edges = [];
      const N = 12;
      for (let i = 0; i < N; i++) {
        nodes.push({ x: canvas.width / 2 + (Math.random() - 0.5) * 300, y: canvas.height / 2 + (Math.random() - 0.5) * 300, vx: 0, vy: 0, id: i });
      }
      for (let i = 0; i < N; i++) {
        edges.push([i, (i + 1) % N]);
        if (Math.random() < 0.4) edges.push([i, (i + 3) % N]);
      }
    }
    initGraph();

    document.getElementById("btnShake").onclick = () => {
      nodes.forEach(n => { n.x += (Math.random() - 0.5) * 200; n.y += (Math.random() - 0.5) * 200; });
    };
    document.getElementById("btnAddNode").onclick = () => {
      const id = nodes.length;
      nodes.push({ x: canvas.width / 2, y: canvas.height / 2, vx: 0, vy: 0, id });
      edges.push([id, Math.floor(Math.random() * id)]);
    };

    canvas.onmousedown = e => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      draggedNode = nodes.find(n => Math.hypot(n.x - mx, n.y - my) < 16);
    };
    window.onmouseup = () => draggedNode = null;
    canvas.onmousemove = e => {
      if (!draggedNode) return;
      const rect = canvas.getBoundingClientRect();
      draggedNode.x = e.clientX - rect.left;
      draggedNode.y = e.clientY - rect.top;
    };

    function stepForces() {
      const k = 85; // optimal spring length
      const cRep = 3200; // repulsion
      const cSpring = 0.04; // attraction

      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = nodes[j].x - nodes[i].x;
          const dy = nodes[j].y - nodes[i].y;
          const dist = Math.hypot(dx, dy) + 0.1;
          const rep = cRep / (dist * dist);
          nodes[i].vx -= (dx / dist) * rep;
          nodes[i].vy -= (dy / dist) * rep;
          nodes[j].vx += (dx / dist) * rep;
          nodes[j].vy += (dy / dist) * rep;
        }
      }

      for (let [u, v] of edges) {
        const dx = nodes[v].x - nodes[u].x;
        const dy = nodes[v].y - nodes[u].y;
        const dist = Math.hypot(dx, dy) + 0.1;
        const att = (dist - k) * cSpring;
        nodes[u].vx += (dx / dist) * att;
        nodes[u].vy += (dy / dist) * att;
        nodes[v].vx -= (dx / dist) * att;
        nodes[v].vy -= (dy / dist) * att;
      }

      nodes.forEach(n => {
        if (n === draggedNode) return;
        n.vx *= 0.85; n.vy *= 0.85; // damping
        n.x += Math.max(-15, Math.min(15, n.vx));
        n.y += Math.max(-15, Math.min(15, n.vy));
        // Soft boundary reflection
        n.x = Math.max(30, Math.min(canvas.width - 30, n.x));
        n.y = Math.max(30, Math.min(canvas.height - 30, n.y));
      });
    }

    function render() {
      stepForces();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw wire interconnects
      ctx.strokeStyle = "rgba(56, 189, 248, 0.4)";
      ctx.lineWidth = 2;
      for (let [u, v] of edges) {
        ctx.beginPath(); ctx.moveTo(nodes[u].x, nodes[u].y); ctx.lineTo(nodes[v].x, nodes[v].y); ctx.stroke();
      }

      // Draw nodes
      nodes.forEach(n => {
        ctx.fillStyle = n === draggedNode ? "#ec4899" : "#f59e0b";
        ctx.beginPath(); ctx.arc(n.x, n.y, 10, 0, 2 * Math.PI); ctx.fill();
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; ctx.stroke();
      });

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
