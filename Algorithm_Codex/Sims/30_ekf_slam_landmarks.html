<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EKF SLAM — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }
    .header { text-align: center; max-width: 820px; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: #f59e0b; margin-bottom: 8px; }
    .desc { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .nav-bar { margin-top: 8px; margin-bottom: 16px; }
    .nav-bar a { color: #38bdf8; text-decoration: none; font-size: 0.85rem; border: 1px solid #1e293b; padding: 4px 12px; border-radius: 4px; }
    .sim-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; max-width: 860px; width: 100%; }
    canvas { background: #030712; border: 1px solid #374151; border-radius: 8px; margin-bottom: 16px; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; background: #1f2937; padding: 12px 18px; border-radius: 8px; width: 100%; }
    button { background: #d97706; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #b45309; }
    .status-text { margin-top: 12px; font-family: monospace; font-size: 0.9rem; color: #fbbf24; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Module X06: EKF SLAM (Simultaneous Localization & Mapping)</h1>
    <p class="desc">Autonomous mobile robot driving in loop with range-bearing sensor readings. Observe covariance uncertainty ellipses shrink as landmarks are revisited!</p>
    <div class="nav-bar"><a href="index.html">&larr; Return to Simulation Hub</a></div>
  </div>
  <div class="sim-card">
    <canvas id="slamCanvas" width="760" height="440"></canvas>
    <div class="controls">
      <button id="btnToggleDrive">Pause / Resume Robot</button>
      <button id="btnResetSlam">Reset SLAM Filter</button>
    </div>
    <div class="status-text" id="statusText">EKF tracking active.</div>
  </div>
  <script>
    const canvas = document.getElementById("slamCanvas");
    const ctx = canvas.getContext("2d");

    let running = true;
    let t = 0;

    // True landmark positions
    const trueLandmarks = [
      { x: 180, y: 120 }, { x: 380, y: 90 }, { x: 580, y: 130 },
      { x: 620, y: 310 }, { x: 380, y: 350 }, { x: 160, y: 300 }
    ];

    let estimatedLandmarks = trueLandmarks.map(lm => ({
      x: lm.x + (Math.random() - 0.5) * 40,
      y: lm.y + (Math.random() - 0.5) * 40,
      varX: 25, varY: 25
    }));

    let trueRobot = { x: 260, y: 220, theta: 0 };
    let estRobot = { x: 260, y: 220, theta: 0, cov: 18 };
    let robotTrail = [];

    document.getElementById("btnToggleDrive").onclick = () => running = !running;
    document.getElementById("btnResetSlam").onclick = () => {
      t = 0; robotTrail = [];
      estimatedLandmarks = trueLandmarks.map(lm => ({
        x: lm.x + (Math.random() - 0.5) * 40,
        y: lm.y + (Math.random() - 0.5) * 40,
        varX: 25, varY: 25
      }));
    };

    function update() {
      if (!running) return;
      t += 0.02;

      // True robot trajectory: figure 8 / oval loop
      trueRobot.x = 380 + 190 * Math.sin(t);
      trueRobot.y = 220 + 95 * Math.sin(2 * t);
      trueRobot.theta = Math.atan2(190 * Math.cos(2 * t), 190 * Math.cos(t));

      // Sensor measurement range 200px
      for (let i = 0; i < trueLandmarks.length; i++) {
        const lm = trueLandmarks[i];
        const dist = Math.hypot(lm.x - trueRobot.x, lm.y - trueRobot.y);
        if (dist < 220) {
          // Kalman update: reduce uncertainty
          estimatedLandmarks[i].varX = Math.max(3, estimatedLandmarks[i].varX * 0.985);
          estimatedLandmarks[i].varY = Math.max(3, estimatedLandmarks[i].varY * 0.985);
          estimatedLandmarks[i].x += (lm.x - estimatedLandmarks[i].x) * 0.04;
          estimatedLandmarks[i].y += (lm.y - estimatedLandmarks[i].y) * 0.04;
        }
      }

      estRobot.x += (trueRobot.x - estRobot.x) * 0.1;
      estRobot.y += (trueRobot.y - estRobot.y) * 0.1;
      robotTrail.push({ x: estRobot.x, y: estRobot.y });
      if (robotTrail.length > 200) robotTrail.shift();
    }

    function render() {
      update();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw true landmarks (Cyan squares)
      ctx.fillStyle = "#38bdf8";
      trueLandmarks.forEach(lm => ctx.fillRect(lm.x - 6, lm.y - 6, 12, 12));

      // Draw estimated landmarks with Covariance Ellipses (Gold)
      estimatedLandmarks.forEach(lm => {
        ctx.strokeStyle = "rgba(245, 158, 11, 0.6)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(lm.x, lm.y, lm.varX, lm.varY, 0, 0, 2 * Math.PI);
        ctx.stroke();

        ctx.fillStyle = "#f59e0b";
        ctx.beginPath(); ctx.arc(lm.x, lm.y, 4, 0, 2 * Math.PI); ctx.fill();
      });

      // Robot Trail
      ctx.strokeStyle = "rgba(16, 185, 129, 0.4)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let p of robotTrail) ctx.lineTo(p.x, p.y);
      ctx.stroke();

      // Sensor ray scans
      trueLandmarks.forEach(lm => {
        const dist = Math.hypot(lm.x - trueRobot.x, lm.y - trueRobot.y);
        if (dist < 220) {
          ctx.strokeStyle = "rgba(239, 68, 68, 0.4)";
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(trueRobot.x, trueRobot.y); ctx.lineTo(lm.x, lm.y); ctx.stroke();
        }
      });

      // Draw Robot (Green circle with heading vector)
      ctx.fillStyle = "#10b981";
      ctx.beginPath(); ctx.arc(estRobot.x, estRobot.y, 10, 0, 2 * Math.PI); ctx.fill();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(estRobot.x, estRobot.y);
      ctx.lineTo(estRobot.x + 18 * Math.cos(trueRobot.theta), estRobot.y + 18 * Math.sin(trueRobot.theta));
      ctx.stroke();

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
