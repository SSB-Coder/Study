<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2D Ising Model — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }
    .header { text-align: center; max-width: 820px; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: #f59e0b; margin-bottom: 8px; }
    .desc { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .nav-bar { margin-top: 8px; margin-bottom: 16px; }
    .nav-bar a { color: #38bdf8; text-decoration: none; font-size: 0.85rem; border: 1px solid #1e293b; padding: 4px 12px; border-radius: 4px; }
    .sim-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; max-width: 860px; width: 100%; }
    canvas { background: #030712; border: 1px solid #374151; border-radius: 8px; margin-bottom: 16px; image-rendering: pixelated; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; background: #1f2937; padding: 12px 18px; border-radius: 8px; width: 100%; }
    button { background: #d97706; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #b45309; }
    .slider-group { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #cbd5e1; }
    .status-text { margin-top: 12px; font-family: monospace; font-size: 0.95rem; color: #fbbf24; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Module S03: 2D Ising Model Metropolis Simulator</h1>
    <p class="desc">Interactive statistical physics simulation of ferromagnetism phase transitions. Witness spontaneous symmetry breaking below Curie temperature $T_c pprox 2.2691 J/k_B$!</p>
    <div class="nav-bar"><a href="index.html">&larr; Return to Simulation Hub</a></div>
  </div>
  <div class="sim-card">
    <canvas id="isingCanvas" width="480" height="480"></canvas>
    <div class="controls">
      <div class="slider-group">
        <label for="tempSlider">Temperature (T):</label>
        <input type="range" id="tempSlider" min="0.5" max="5.0" step="0.05" value="2.27">
        <span id="tempVal">2.27</span>
      </div>
      <button id="btnCurie">Set T = Tc (2.269)</button>
      <button id="btnCold">Cold Ferromagnet (T=0.5)</button>
      <button id="btnHot">Hot Paramagnet (T=5.0)</button>
    </div>
    <div class="status-text" id="statusText">Magnetization: computing...</div>
  </div>
  <script>
    const canvas = document.getElementById("isingCanvas");
    const ctx = canvas.getContext("2d");
    const L = 80;
    const cellSize = canvas.width / L;
    let grid = new Int8Array(L * L);
    let T = 2.27;

    for (let i = 0; i < grid.length; i++) grid[i] = Math.random() < 0.5 ? 1 : -1;

    const tempSlider = document.getElementById("tempSlider");
    tempSlider.oninput = e => { T = parseFloat(e.target.value); document.getElementById("tempVal").innerText = T.toFixed(2); };
    document.getElementById("btnCurie").onclick = () => { T = 2.269; tempSlider.value = 2.27; document.getElementById("tempVal").innerText = "2.27"; };
    document.getElementById("btnCold").onclick = () => { T = 0.5; tempSlider.value = 0.5; document.getElementById("tempVal").innerText = "0.50"; };
    document.getElementById("btnHot").onclick = () => { T = 5.0; tempSlider.value = 5.0; document.getElementById("tempVal").innerText = "5.00"; };

    function metropolisSweep(steps = 15000) {
      for (let s = 0; s < steps; s++) {
        const x = (Math.random() * L) | 0;
        const y = (Math.random() * L) | 0;
        const idx = y * L + x;
        const spin = grid[idx];

        const up = ((y - 1 + L) % L) * L + x;
        const down = ((y + 1) % L) * L + x;
        const left = y * L + ((x - 1 + L) % L);
        const right = y * L + ((x + 1) % L);

        const neighbors = grid[up] + grid[down] + grid[left] + grid[right];
        const dE = 2 * spin * neighbors;

        if (dE <= 0 || Math.random() < Math.exp(-dE / T)) {
          grid[idx] = -spin;
        }
      }
    }

    function render() {
      metropolisSweep(20000);
      let totalM = 0;

      for (let y = 0; y < L; y++) {
        for (let x = 0; x < L; x++) {
          const s = grid[y * L + x];
          totalM += s;
          ctx.fillStyle = s === 1 ? "#38bdf8" : "#f97316";
          ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
        }
      }

      const meanM = Math.abs(totalM / (L * L));
      document.getElementById("statusText").innerHTML =
        `Temperature T = ${T.toFixed(2)} J/k_B &nbsp;|&nbsp; <strong>|Magnetization| = ${meanM.toFixed(3)}</strong> &nbsp;|&nbsp; (${T < 2.269 ? 'Ordered Ferromagnetic' : 'Disordered Paramagnetic'})`;

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
