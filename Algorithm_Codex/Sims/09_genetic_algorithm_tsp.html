<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genetic Algorithm (TSP) — Algorithm Codex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .header {
      text-align: center;
      max-width: 800px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 8px;
    }
    .desc {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .nav-bar {
      margin-top: 8px;
      margin-bottom: 16px;
    }
    .nav-bar a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid #1e293b;
      padding: 4px 12px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .nav-bar a:hover {
      background: #1e293b;
    }
    .sim-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 1000px;
      width: 100%;
    }
    canvas {
      background: #030712;
      border: 1px solid #374151;
      border-radius: 8px;
      cursor: crosshair;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-top: 16px;
      width: 100%;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button.secondary {
      background: #374151;
    }
    button.secondary:hover { background: #4b5563; }
    .param-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    input[type="range"] {
      accent-color: #3b82f6;
    }
    .metrics-panel {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      font-size: 0.9rem;
      color: #a7f3d0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #0f172a;
      padding: 10px 20px;
      border-radius: 6px;
      border: 1px solid #1e293b;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Genetic Algorithm (TSP)</h1>
    <p class="desc">Module H: Natural selection and order crossover (OX) evolving short Hamiltonian cycles for 20 cities.</p>
    <div class="nav-bar"><a href="index.html">← Back to All Visualizers</a></div>
  </div>

  <div class="sim-card">
    <canvas id="simCanvas" width="650" height="420"></canvas>
    
    <div class="controls">
      
<button id="btnRunGA">Run / Pause GA</button>
<button id="btnStepGA">Step Generation</button>
<button id="btnNewTSP" class="secondary">New Cities</button>

    </div>

    <div class="metrics-panel" id="metricsPanel">
      <span>Status: Ready</span>
    </div>
  </div>

  <script>
    
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let cities = [];
let population = [];
let popSize = 60;
let bestTour = [];
let bestDist = Infinity;
let genCount = 0;
let isRunning = false;

function initCities(n = 20) {
  cities = [];
  for (let i = 0; i < n; i++) {
    cities.push({ x: 40 + Math.random() * (W - 80), y: 40 + Math.random() * (H - 80) });
  }
  genCount = 0;
  bestDist = Infinity;

  // Init pop
  population = [];
  for (let i = 0; i < popSize; i++) {
    let order = Array.from({length: n}, (_, idx) => idx);
    for (let j = n - 1; j > 0; j--) {
      let r = Math.floor(Math.random() * (j + 1));
      [order[j], order[r]] = [order[r], order[j]];
    }
    population.push(order);
  }
  evaluate();
  draw();
}

function dist(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }

function tourDist(order) {
  let d = 0;
  for (let i = 0; i < order.length; i++) {
    d += dist(cities[order[i]], cities[order[(i + 1) % order.length]]);
  }
  return d;
}

function evaluate() {
  for (let ind of population) {
    let d = tourDist(ind);
    if (d < bestDist) {
      bestDist = d;
      bestTour = [...ind];
    }
  }
}

function stepGA() {
  genCount++;
  // Sort
  population.sort((a, b) => tourDist(a) - tourDist(b));
  let newPop = [ [...population[0]], [...population[1]] ]; // Elites

  while (newPop.length < popSize) {
    let p1 = population[Math.floor(Math.random() * 15)];
    let p2 = population[Math.floor(Math.random() * 15)];
    
    // Order crossover (OX)
    let cut1 = Math.floor(Math.random() * cities.length);
    let cut2 = Math.floor(Math.random() * cities.length);
    if (cut1 > cut2) [cut1, cut2] = [cut2, cut1];

    let child = new Array(cities.length).fill(-1);
    for (let i = cut1; i <= cut2; i++) child[i] = p1[i];

    let fillIdx = 0;
    for (let i = 0; i < cities.length; i++) {
      let candidate = p2[i];
      if (!child.includes(candidate)) {
        while (child[fillIdx] !== -1) fillIdx++;
        child[fillIdx] = candidate;
      }
    }

    // Mutation: 2-opt swap
    if (Math.random() < 0.2) {
      let i1 = Math.floor(Math.random() * cities.length);
      let i2 = Math.floor(Math.random() * cities.length);
      [child[i1], child[i2]] = [child[i2], child[i1]];
    }

    newPop.push(child);
  }

  population = newPop;
  evaluate();
  document.getElementById('metricsPanel').innerHTML = 
    `<span>Generation: ${genCount}</span><span>Best Tour Distance: ${bestDist.toFixed(1)}px</span>`;
  draw();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Draw tour
  if (bestTour.length > 0) {
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < bestTour.length; i++) {
      let c = cities[bestTour[i]];
      if (i === 0) ctx.moveTo(c.x, c.y);
      else ctx.lineTo(c.x, c.y);
    }
    ctx.closePath();
    ctx.stroke();
  }

  // Draw cities
  for (let c of cities) {
    ctx.fillStyle = '#f43f5e';
    ctx.beginPath(); ctx.arc(c.x, c.y, 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();
  }
}

document.getElementById('btnStepGA').onclick = stepGA;
document.getElementById('btnRunGA').onclick = () => {
  isRunning = !isRunning;
  document.getElementById('btnRunGA').innerText = isRunning ? "Pause" : "Run";
  if (isRunning) loop();
};
document.getElementById('btnNewTSP').onclick = () => initCities(20);

function loop() {
  if (isRunning) {
    stepGA();
    requestAnimationFrame(loop);
  }
}

initCities(20);

  </script>
</body>
</html>
